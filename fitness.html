<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Law Brewing - Functional Fitness</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@700&family=Bebas+Neue&family=Roboto:wght@400&display=swap" rel="stylesheet">
    
    <style>
        /* --- Embedded CSS Styling --- */
        
        /* General Styling */
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #0d0d0d;
            color: #f0f0f0;
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        /* Header/Hero Section */
        .hero {
            position: relative;
            min-height: 350px; 
            padding-top: 50px; 
            padding-bottom: 50px; 
            background-color: #2a2a2a;
            /* Placeholder background image */
            background-image: url('rustic-wood-planks.jpg'); 
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
            margin-bottom: 50px;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7); /* Slightly darker overlay */
        }
        
        /* Logo Link Styling */
        .logo-link {
            position: relative;
            z-index: 20; /* High z-index to ensure clickability */
            display: inline-block;
            transition: transform 0.2s ease;
        }

        .logo-link:hover {
            transform: scale(1.05); /* Subtle zoom on hover */
            cursor: pointer;
        }

        .logo {
            max-width: 150px;
            height: auto;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 10px #ffcc00);
            display: block; /* Removes weird spacing inside link */
        }

        .site-title {
            position: relative;
            z-index: 10;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 5em;
            letter-spacing: 15px;
            margin: 0;
            color: #ffcc00;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.8);
        }

        .tagline {
            position: relative;
            z-index: 10;
            font-family: 'Roboto Slab', serif;
            font-size: 1.5em;
            margin-top: 5px;
            color: #f0f0f0;
            border-bottom: 2px solid #ffcc00;
            padding-bottom: 5px;
        }

        /* Section Title */
        .section-title {
            text-align: center;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 3em;
            color: #ffcc00;
            margin-bottom: 40px;
            text-transform: uppercase;
            letter-spacing: 5px;
        }

        /* App Container */
        .app-container {
            display: grid;
            /* Auto-fit will size them nicely; with 2 items they will be large and readable */
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 40px; 
            padding: 0 5%;
            max-width: 1400px;
            margin: 0 auto 80px auto;
        }

        .app-card {
            background-color: #202020;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.6);
            transition: transform 0.3s ease-in-out, box-shadow 0.3s ease-in-out;
            display: flex;
            flex-direction: column;
            border: 1px solid #444; 
        }

        .app-card:hover {
            transform: translateY(-10px) rotateZ(-1deg);
            box-shadow: 0 15px 30px rgba(255, 204, 0, 0.4); 
        }

        .app-image-container {
            height: 200px; 
            background-color: #000;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .app-image {
            width: 100%;
            height: 100%;
            border-radius: 8px;
            object-fit: contain; 
        }

        .card-content {
            padding: 20px 25px 30px;
            text-align: center;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        
        .app-title {
            font-family: 'Roboto Slab', serif;
            font-size: 1.4em;
            height: 3em; 
            overflow: hidden;
            margin-top: 0;
            margin-bottom: 10px;
            color: #ffffff;
            line-height: 1.2;
        }
        
        .app-desc {
            font-size: 0.9em;
            color: #bbb;
            margin-bottom: 20px;
            height: 3em; 
            overflow: hidden;
        }

        /* Button Styling */
        .app-button {
            display: block; 
            background-color: #ffcc00; 
            color: #1a1a1a; 
            padding: 15px 25px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.4em;
            letter-spacing: 2px;
            transition: background-color 0.2s ease, transform 0.1s ease;
            border: none;
            text-transform: uppercase;
        }

        .app-button:hover {
            background-color: #e5b800;
            transform: scale(0.98);
        }
        
        /* Responsive adjustments */
        @media (max-width: 768px) {
            .site-title {
                font-size: 3.5em;
                letter-spacing: 10px;
            }
            .hero {
                min-height: 250px; 
                padding-top: 40px; 
                padding-bottom: 40px;
            }
        }
    </style>
</head>
<body>

    <header class="hero">
        <a href="https://lawbrewing.github.io/LawBrewing/" class="logo-link">
            <img src="https://github.com/lawbrewing/LawBrewing/blob/main/LBC%20-%20Black%20Transparent%20(1).png?raw=true" alt="Law Brewing Logo - Return Home" class="logo">
        </a>
        
        <h1 class="site-title">LAW BREWING</h1>
        <p class="tagline">Stay Aggressive.</p>
    </header>

    <h2 class="section-title">The Workout Apps</h2>

    <section class="app-container">
        
        <div class="app-card">
            <div class="app-image-container">
                <img src="https://lawbrewing.github.io/LawBrewing/volleyballfit.png" alt="Volleyball Fit Icon" class="app-image">
            </div>
            <div class="card-content">
                <h3 class="app-title">Volleyball Fit</h3>
                <p class="app-desc">Performance training designed for the court.</p>
                <a href="https://lawbrewing.github.io/LawBrewing/Volleyballfit.html" class="app-button">Launch App</a>
            </div>
        </div>

        <div class="app-card">
            <div class="app-image-container">
                <img src="https://lawbrewing.github.io/LawBrewing/1765935546748~2.jpg" alt="Cardio Low Back Icon" class="app-image">
            </div>
            <div class="card-content">
                <h3 class="app-title">Cardio Low Back</h3>
                <p class="app-desc">Low impact cardio focused on core and back health.</p>
                <a href="https://lawbrewing.github.io/LawBrewing/Cardiolowback.html" class="app-button">Launch App</a>
            </div>
        </div>

    </section>

</body>
</html>
