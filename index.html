<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Law Brewing Tap List</title>
    <style>
        :root {
            --gold: #d4a017;
            --dark: #1a1a1a;
        }
        body { 
            background-color: var(--dark); 
            color: white; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 20px;
        }
        h1 { text-align: center; color: var(--gold); text-transform: uppercase; letter-spacing: 2px; }
        
        .tap-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .tap-card {
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            transition: transform 0.3s ease;
        }

        .tap-label {
            color: var(--gold);
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 10px;
            display: block;
        }

        .beer-art {
            width: 150px;
            height: 150px;
            object-fit: contain;
            border-radius: 10px;
            margin-bottom: 15px;
            background: #222;
        }

        h2 { margin: 10px 0; font-size: 1.8rem; }
        .abv { color: var(--gold); font-weight: bold; margin-bottom: 10px; }
        .desc { font-size: 0.9rem; color: #ccc; line-height: 1.4; min-height: 60px; }

        /* Progress Bar Styles */
        .progress-container {
            background: #444;
            border-radius: 10px;
            height: 25px;
            width: 100%;
            margin-top: 20px;
            position: relative;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #8b0000, #d4a017);
            transition: width 1s ease-in-out;
            width: 0%;
        }

        .percent-text {
            position: absolute;
            width: 100%;
            text-align: center;
            top: 0;
            left: 0;
            line-height: 25px;
            font-size: 0.8rem;
            font-weight: bold;
            text-shadow: 1px 1px 2px black;
        }
    </style>
</head>
<body>

    <h1>Law Brewing Co.</h1>
    
    <div class="tap-container" id="tap-display">
        </div>

    <script>
        async function updateTapList() {
            try {
                // Fetch the latest JSON from your GitHub Pages
                const response = await fetch('taps.json?t=' + new Date().getTime());
                const data = await response.json();
                
                const display = document.getElementById('tap-display');
                display.innerHTML = ''; // Clear current display

                // Loop through the 3 active taps defined in your JSON
                for (const [tapSlot, beerName] of Object.entries(data.active_taps)) {
                    
                    // Look up this beer's details in the library
                    const details = data.library[beerName] || {
                        abv: "0%",
                        desc: "Information coming soon.",
                        artwork: "logo.png",
                        percent: 0
                    };

                    const card = document.createElement('div');
                    card.className = 'tap-card';
                    
                    card.innerHTML = `
                        <span class="tap-label">${tapSlot}</span>
                        <img src="images/labels/${details.artwork}" class="beer-art" onerror="this.src='images/labels/logo.png'">
                        <h2>${beerName}</h2>
                        <div class="abv">ABV: ${details.abv}</div>
                        <p class="desc">${details.desc}</p>
                        
                        <div class="progress-container">
                            <div class="progress-bar" style="width: ${details.percent}%"></div>
                            <div class="percent-text">${details.percent}% REMAINING</div>
                        </div>
                    `;
                    
                    display.appendChild(card);
                }
            } catch (error) {
                console.error("Error loading tap data:", error);
            }
        }

        // Initial load
        updateTapList();

        // Refresh the page every 2 minutes to show scale updates
        setInterval(updateTapList, 120000);
    </script>
</body>
</html>
