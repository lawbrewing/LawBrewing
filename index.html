<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Law Brewing Co. | Live Taproom</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Roboto:wght@300;400&display=swap" rel="stylesheet">
    <style>
        :root { 
            --accent: #ffb400; 
            --bg: #121212; 
            --card: #1e1e1e; 
            --text: #ffffff;
        }

        body { 
            background: var(--bg); 
            color: var(--text); 
            font-family: 'Roboto', sans-serif; 
            margin: 0; 
            padding-bottom: 80px;
        }

        /* HEADER */
        .header-container {
            text-align: center;
            padding: 50px 0 30px;
            background: radial-gradient(circle, #2a2a2a 0%, #121212 80%);
            border-bottom: 2px solid var(--accent);
        }
        .backlit-logo { max-width: 280px; filter: drop-shadow(0 0 10px rgba(255,180,0,0.5)); }
        .sub-brand { font-family: 'Oswald', sans-serif; color: var(--accent); text-transform: uppercase; letter-spacing: 6px; margin-top: 15px; font-size: 1.5rem; }
        
        /* NEW: TIMESTAMP STYLE */
        .last-updated {
            font-size: 0.8rem;
            color: #666;
            margin-top: 10px;
            font-family: 'Roboto', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* LIVE GRID */
        .tap-container { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); 
            gap: 30px; 
            max-width: 1300px; 
            margin: 40px auto; 
            padding: 20px;
        }

        .beer-card { 
            background: var(--card); border-radius: 20px; overflow: hidden; 
            border: 1px solid #333; box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
            display: flex; flex-direction: column;
        }
        .label-art { 
            width: 100%; height: 350px; 
            background-size: contain; background-repeat: no-repeat; 
            background-position: center; background-color: #000; 
            border-bottom: 3px solid var(--accent); 
        }
        .details { padding: 25px; flex-grow: 1; display: flex; flex-direction: column; }
        .tap-id-tag { font-size: 0.85rem; color: #888; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 5px; }
        .beer-name { font-family: 'Oswald', sans-serif; font-size: 2.2rem; margin: 0 0 5px 0; text-transform: uppercase; line-height: 1.1; }
        .stats { font-family: 'Oswald', sans-serif; color: var(--accent); font-size: 1.2rem; margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .description { font-size: 1rem; color: #ccc; line-height: 1.6; margin-bottom: 25px; white-space: pre-wrap; }

        /* PROGRESS BAR */
        .volume-container { background: #000; height: 38px; border-radius: 19px; position: relative; overflow: hidden; border: 2px solid #444; margin-top: auto; }
        .volume-bar { background: linear-gradient(90deg, #b8860b, var(--accent)); height: 100%; transition: width 1.5s ease; }
        .volume-text { position: absolute; width: 100%; text-align: center; top: 8px; font-weight: bold; color: white; text-shadow: 1px 1px 3px black; }

        /* ARCHIVE TOGGLE BUTTON */
        .toggle-btn {
            display: block; width: 250px; margin: 40px auto; padding: 15px;
            background: transparent; border: 2px solid var(--accent); color: var(--accent);
            font-family: 'Oswald', sans-serif; font-size: 1.2rem; text-transform: uppercase;
            letter-spacing: 2px; cursor: pointer; border-radius: 50px; transition: all 0.3s;
        }
        .toggle-btn:hover { background: var(--accent); color: black; box-shadow: 0 0 20px rgba(255,180,0,0.4); }

        /* ARCHIVE SECTION */
        #archive-wrapper { 
            max-height: 0; overflow: hidden; transition: max-height 0.8s ease-out; background: rgba(0,0,0,0.2);
        }
        #archive-wrapper.open { max-height: 10000px; padding-top: 40px; padding-bottom: 60px; }

        .archive-grid {
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 25px; max-width: 1200px; margin: 0 auto; padding: 20px;
        }
        .archive-card { 
            background: #1a1a1a; border-radius: 15px; border: 1px solid #333; 
            text-align: center; overflow: hidden; display: flex; flex-direction: column;
        }
        .archive-art { 
            width: 100%; height: 220px; 
            background-size: contain; background-repeat: no-repeat; 
            background-position: center; background-color: #080808;
            border-bottom: 1px solid #333;
        }
        .archive-details { padding: 15px; }
        .archive-name { font-family: 'Oswald', sans-serif; font-size: 1.2rem; margin: 0; text-transform: uppercase; color: #fff; line-height: 1.2; }
        .archive-stats { color: var(--accent); font-family: 'Oswald', sans-serif; font-size: 0.9rem; margin-top: 5px; }
    </style>
</head>
<body>

    <div class="header-container">
        <img src="https://github.com/lawbrewing/LawBrewing/blob/main/LBC%20-%20Black%20Transparent%20(1).png?raw=true" alt="Law Brewing Logo" class="backlit-logo">
        <div class="sub-brand">Liquid Attitude Taps</div>
        <div id="last-updated-text" class="last-updated">Waiting for data...</div>
    </div>

    <div class="tap-container" id="tap-display"></div>

    <button class="toggle-btn" id="toggle-archive" onclick="toggleArchive()">View The Cellar</button>

    <div id="archive-wrapper">
        <h2 style="text-align: center; font-family: 'Oswald'; color: var(--accent); letter-spacing: 4px; margin-bottom: 30px;">PAST BREWS</h2>
        <div class="archive-grid" id="archive-display"></div>
    </div>

    <script>
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQWqyJ5-pMWhRUkkZLoHdmFPtOHJozHRJkL9c0ivSSY9J7Fp0lto4W05tH-XbFelBL-htJZXedhv7i3/pub?output=csv';

        function parseCSV(str) {
            const rows = [];
            let quote = false, col = "", row = [];
            for (let c = 0; c < str.length; c++) {
                let char = str[c], next = str[c+1];
                if (char == '"' && quote && next == '"') { col += char; c++; continue; }
                if (char == '"') { quote = !quote; continue; }
                if (char == ',' && !quote) { row.push(col.trim()); col = ""; continue; }
                if (char == '\n' && !quote) { row.push(col.trim()); rows.push(row); col = ""; row = []; continue; }
                col += char;
            }
            row.push(col.trim()); rows.push(row);
            return rows;
        }

        function toggleArchive() {
            const wrapper = document.getElementById('archive-wrapper');
            const btn = document.getElementById('toggle-archive');
            wrapper.classList.toggle('open');
            btn.innerText = wrapper.classList.contains('open') ? "Close The Cellar" : "View The Cellar";
        }

        async function updateDisplay() {
            try {
                const cacheBuster = new Date().getTime();
                const [wRes, sRes] = await Promise.all([
                    fetch('tap_weights.json?t=' + cacheBuster),
                    fetch(CSV_URL + '&t=' + cacheBuster)
                ]);

                const weights = await wRes.json();
                const csvData = parseCSV(await sRes.text());
                
                const tapContainer = document.getElementById('tap-display');
                const archiveContainer = document.getElementById('archive-display');
                
                // --- NEW: Update the Time ---
                if (weights.last_updated) {
                    document.getElementById('last-updated-text').innerText = "Last Updated: " + weights.last_updated;
                }
                
                tapContainer.innerHTML = '';
                archiveContainer.innerHTML = '';

                for (let i = 1; i < csvData.length; i++) {
                    const row = csvData[i];
                    if (!row[2]) continue;

                    const tapID  = row[0];
                    const bName  = row[2];
                    const bABV   = row[3];
                    const bImage = row[4];
                    const bDesc  = row[5];

                    if (tapID && tapID !== "") {
                        const pct = weights[tapID] || 0;
                        tapContainer.innerHTML += `
                            <div class="beer-card">
                                <div class="label-art" style="background-image: url('${bImage}');"></div>
                                <div class="details">
                                    <div class="tap-id-tag">${tapID}</div>
                                    <h2 class="beer-name">${bName}</h2>
                                    <div class="stats">ABV: ${bABV}</div>
                                    <p class="description">${bDesc}</p>
                                    <div class="volume-container">
                                        <div class="volume-bar" style="width: ${pct}%"></div>
                                        <div class="volume-text">${pct}% REMAINING</div>
                                    </div>
                                </div>
                            </div>`;
                    } else {
                        archiveContainer.innerHTML += `
                            <div class="archive-card">
                                <div class="archive-art" style="background-image: url('${bImage}');"></div>
                                <div class="archive-details">
                                    <h3 class="archive-name">${bName}</h3>
                                    <div class="archive-stats">ABV: ${bABV}</div>
                                </div>
                            </div>`;
                    }
                }
            } catch (err) { console.log("Updating...", err); }
        }

        updateDisplay();
        setInterval(updateDisplay, 30000);
    </script>
</body>
</html>
