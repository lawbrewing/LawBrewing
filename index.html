<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Law Brewing | Live Taproom</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Roboto:wght@300;400&family=Bebas+Neue&family=Roboto+Slab:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #ffb400; --bg: #121212; --card: #1e1e1e; --text: #ffffff; }
        body { background: var(--bg); color: var(--text); font-family: 'Roboto', sans-serif; margin: 0; padding-bottom: 80px; }
        .header-container { text-align: center; padding: 50px 0 30px; background: radial-gradient(circle, #2a2a2a 0%, #121212 80%); border-bottom: 2px solid var(--accent); }
        .backlit-logo { max-width: 280px; filter: drop-shadow(0 0 10px rgba(255,180,0,0.5)); }
        .sub-brand { font-family: 'Oswald', sans-serif; color: var(--accent); text-transform: uppercase; letter-spacing: 6px; margin-top: 15px; font-size: 1.5rem; }
        .tap-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 30px; max-width: 1300px; margin: 40px auto; padding: 20px; align-items: stretch; }
        .beer-card { background: var(--card); border-radius: 20px; border: 1px solid #333; display: flex; flex-direction: column; position: relative; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); height: 100%; }
        .top-rated-ribbon { position: absolute; top: 15px; right: -35px; background: var(--accent); color: #000; padding: 5px 40px; transform: rotate(45deg); font-family: 'Oswald'; font-weight: bold; font-size: 0.8rem; z-index: 10; box-shadow: 0 0 15px rgba(0,0,0,0.5); text-transform: uppercase; }
        .beer-name { font-family: 'Oswald', sans-serif; font-size: 2.1rem; margin: 0; text-transform: none !important; line-height: 1.1; }
        .label-art { width: 100%; height: 350px; background-size: contain; background-repeat: no-repeat; background-position: center; background-color: #000; border-bottom: 3px solid var(--accent); }
        .details { padding: 25px; flex-grow: 1; display: flex; flex-direction: column; }
        .beer-name-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 5px; }
        .avg-badge { background: rgba(255,180,0,0.15); color: var(--accent); padding: 4px 10px; border-radius: 8px; font-size: 1.1rem; border: 1px solid rgba(255,180,0,0.4); font-family: 'Oswald'; font-weight: bold; white-space: nowrap; }
        .stats { font-family: 'Oswald', sans-serif; color: var(--accent); font-size: 1.1rem; margin: 10px 0; display: flex; justify-content: space-between; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .description { font-size: 0.95rem; color: #ccc; line-height: 1.5; margin-bottom: 20px; flex-grow: 1; white-space: pre-wrap; }
        .rating-box { background: rgba(255,255,255,0.03); padding: 12px; border-radius: 12px; margin-bottom: 20px; text-align: center; border: 1px solid #333; min-height: 70px; display: flex; align-items: center; justify-content: center; }
        .stars { display: flex; flex-direction: row-reverse; justify-content: center; gap: 5px; }
        .stars input { display: none; }
        .stars label { font-size: 2.3rem; color: #333; cursor: pointer; transition: 0.2s; line-height: 1; }
        .stars label:hover, .stars label:hover ~ label, .stars input:checked ~ label { color: var(--accent); text-shadow: 0 0 10px rgba(255,180,0,0.5); }
        .thanks-msg { display: none; font-family: 'Oswald'; color: var(--accent); font-size: 1.3rem; font-weight: bold; letter-spacing: 1px; }
        .volume-container { background: #000; height: 32px; border-radius: 16px; position: relative; overflow: hidden; border: 2px solid #444; margin-top: auto; }
        .volume-bar { background: linear-gradient(90deg, #b8860b, var(--accent)); height: 100%; transition: width 1.5s ease; }
        .volume-text { position: absolute; width: 100%; text-align: center; top: 6px; font-weight: bold; font-size: 0.9rem; color: white; text-shadow: 1px 1px 3px black; }
        .tap-timestamp { font-size: 0.75rem; color: #777; text-align: center; margin-top: 10px; text-transform: uppercase; letter-spacing: 1.5px; font-weight: bold; border-top: 1px solid #2a2a2a; padding-top: 8px; }
        .button-center { display: flex; justify-content: center; gap: 20px; margin: 40px auto; flex-wrap: wrap; }
        .toggle-btn { padding: 12px 30px; background: transparent; border: 2px solid var(--accent); color: var(--accent); font-family: 'Oswald'; cursor: pointer; border-radius: 50px; text-transform: uppercase; letter-spacing: 1px; transition: 0.3s; }
        .toggle-btn:hover { background: var(--accent); color: #000; }
        .expand-section { max-height: 0; overflow: hidden; transition: max-height 0.8s ease-out; background: rgba(0,0,0,0.3); }
        .expand-section.open { max-height: 20000px; padding: 40px 0; }
    </style>
</head>
<body>
    <div class="header-container">
        <img src="https://github.com/lawbrewing/LawBrewing/blob/main/LBC%20-%20Black%20Transparent%20(1).png?raw=true" alt="Law Brewing" class="backlit-logo">
        <div class="sub-brand">Liquid Attitude Taps</div>
    </div>
    <div class="tap-container" id="tap-display"></div>
    <div class="button-center">
        <button class="toggle-btn" onclick="toggleSection('archive-wrapper')">View The Cellar</button>
        <button class="toggle-btn" onclick="toggleSection('game-wrapper')">Bar Games</button>
    </div>
    <div id="archive-wrapper" class="expand-section">
        <h2 style="text-align:center; font-family:'Oswald'; color:var(--accent); letter-spacing:4px; font-size:2.5rem; margin-bottom:30px;">Beer Archives</h2>
        <div id="archive-display" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 25px; max-width: 1300px; margin: 0 auto; padding: 20px;"></div>
    </div>

    <div id="game-wrapper" class="expand-section">
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; max-width: 1300px; margin: 0 auto; padding: 0 20px;">
            <div style="background:#202020; border-radius:15px; border:1px solid #444; overflow:hidden;"><img src="https://github.com/lawbrewing/LawBrewing/blob/main/Gemini_Generated_Image_f46i9af46i9af46i.png?raw=true" style="height:200px; width:100%; object-fit:contain; background:#000; padding:10px;"><div style="padding:20px; text-align:center;"><h3 style="color:white; font-family:'Roboto Slab';">Sheriff of Taps</h3><a href="defender.html" style="display:block; background:var(--accent); color:#1a1a1a; padding:12px; text-decoration:none; font-family:'Bebas Neue';">Play Defender</a></div></div>
            <div style="background:#202020; border-radius:15px; border:1px solid #444; overflow:hidden;"><img src="1766341219164~2.jpg" style="height:200px; width:100%; object-fit:contain; background:#000; padding:10px;"><div style="padding:20px; text-align:center;"><h3 style="color:white; font-family:'Roboto Slab';">Beer Flight Card Game</h3><a href="Thetaproom.html" style="display:block; background:var(--accent); color:#1a1a1a; padding:12px; text-decoration:none; font-family:'Bebas Neue';">Play Taproom</a></div></div>
            <div style="background:#202020; border-radius:15px; border:1px solid #444; overflow:hidden;"><img src="https://github.com/lawbrewing/LawBrewing/blob/main/bardice%20(2).png?raw=true" style="height:200px; width:100%; object-fit:contain; background:#000; padding:10px;"><div style="padding:20px; text-align:center;"><h3 style="color:white; font-family:'Roboto Slab';">Bar Dice</h3><a href="bardice.html" style="display:block; background:var(--accent); color:#1a1a1a; padding:12px; text-decoration:none; font-family:'Bebas Neue';">Play Bar Dice</a></div></div>
            <div style="background:#202020; border-radius:15px; border:1px solid #444; overflow:hidden;"><img src="https://github.com/lawbrewing/LawBrewing/blob/main/ttt.png?raw=true" style="height:200px; width:100%; object-fit:contain; background:#000; padding:10px;"><div style="padding:20px; text-align:center;"><h3 style="color:white; font-family:'Roboto Slab';">Tic Tac Toe</h3><a href="tictactoe.html" style="display:block; background:var(--accent); color:#1a1a1a; padding:12px; text-decoration:none; font-family:'Bebas Neue';">Play Tic Tac Toe</a></div></div>
            <div style="background:#202020; border-radius:15px; border:1px solid #444; overflow:hidden;"><img src="https://github.com/lawbrewing/LawBrewing/blob/main/taproomchaos.png?raw=true" style="height:200px; width:100%; object-fit:contain; background:#000; padding:10px;"><div style="padding:20px; text-align:center;"><h3 style="color:white; font-family:'Roboto Slab';">Taproom Chaos</h3><a href="taproomchaosgame.html" style="display:block; background:var(--accent); color:#1a1a1a; padding:12px; text-decoration:none; font-family:'Bebas Neue';">Play Chaos</a></div></div>
        </div>
    </div>

    <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>
    <form id="rating_form" action="https://docs.google.com/forms/d/e/1FAIpQLSfx4apNIy6wi1CrFW-B8u01vJ_2ci1fcStPSWcWLFK9DpRs8g/formResponse" method="POST" target="hidden_iframe" style="display:none;">
        <input type="hidden" name="entry.1650190471" id="form_beer">
        <input type="hidden" name="entry.958548151" id="form_score">
    </form>

    <script>
        const MAIN_CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQWqyJ5-pMWhRUkkZLoHdmFPtOHJozHRJkL9c0ivSSY9J7Fp0lto4W05tH-XbFelBL-htJZXedhv7i3/pub?output=csv';
        const SCOREBOARD_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRHD6zTvSE5HfErbLPAHhb0NyXDLuvt_cpOEQxr76BFNpN-KgbL3y68LIogt1aEhVAxIP4JU9t1Kte1/pub?gid=1912157964&single=true&output=csv";

        function parseCSV(data) {
            const result = []; let row = []; let col = ''; let inQuotes = false;
            for (let i = 0; i < data.length; i++) {
                let char = data[i], next = data[i+1];
                if (char === '"' && inQuotes && next === '"') { col += '"'; i++; }
                else if (char === '"') { inQuotes = !inQuotes; }
                else if (char === ',' && !inQuotes) { row.push(col); col = ''; }
                else if (char === '\n' && !inQuotes) { row.push(col); result.push(row); row = []; col = ''; }
                else { col += char; }
            }
            if (col || row.length) { row.push(col); result.push(row); }
            return result;
        }

        function submitRating(beerName, score, cardId) {
            if(localStorage.getItem('voted_' + beerName)) {
                alert("Cheers! You've already rated this one."); return;
            }
            document.getElementById('form_beer').value = beerName;
            document.getElementById('form_score').value = score;
            document.getElementById('rating_form').submit();
            localStorage.setItem('voted_' + beerName, 'true');
            document.getElementById(`box-${cardId}`).innerHTML = '<div class="thanks-msg" style="display:block">CHEERS! 🍻</div>';
        }

        async function updateDisplay() {
            try {
                const cb = new Date().getTime();
                const [wRes, mRes] = await Promise.all([
                    fetch('tap_weights.json?t=' + cb),
                    fetch(MAIN_CSV + '&t=' + cb)
                ]);
                const weights = await wRes.json();
                const beerData = parseCSV(await mRes.text());
                
                let ratingMap = {}; let maxRating = 0; let topBeer = "";
                try {
                    const rRes = await fetch(SCOREBOARD_URL + '&t=' + cb);
                    const ratingText = await rRes.text();
                    if (ratingText && !ratingText.includes("DOCTYPE")) {
                        parseCSV(ratingText).forEach(r => {
                            if(r[0] && r[1]) {
                                const s = parseFloat(r[1]);
                                ratingMap[r[0].trim()] = s.toFixed(1);
                                if (s > maxRating) { maxRating = s; topBeer = r[0].trim(); }
                            }
                        });
                    }
                } catch(e) {}

                const tapContainer = document.getElementById('tap-display');
                const archiveContainer = document.getElementById('archive-display');
                tapContainer.innerHTML = ''; archiveContainer.innerHTML = '';

                let universalSync = weights["last_updated"] || weights["updated"] || "--:--";

                beerData.forEach((row, i) => {
                    if (i === 0 || row.length < 3) return;
                    const tapID = (row[0] || "").trim(); // ORIGINAL LOGIC: No lowercase mapping
                    const bName = (row[2] || "").trim();
                    if (!bName) return;

                    const isTop = (bName === topBeer && maxRating > 0);
                    const untappdID = (row[1] || "").trim();
                    const untappdUrl = untappdID ? `https://untappd.com/qr/beer/${untappdID}` : null;
                    const avgBadge = ratingMap[bName] ? `<span class="avg-badge">⭐ ${ratingMap[bName]}</span>` : '';

                    // ORIGINAL WEIGHT LOOKUP: Uses tapID (e.g., "Law Tap") directly from Column 1
                    const pct = weights[tapID] || 0;

                    let cardHTML = `
                        <div class="beer-card">
                            ${isTop ? '<div class="top-rated-ribbon">Most Popular</div>' : ''}
                            ${untappdUrl ? `<a href="${untappdUrl}" target="_blank">` : ''}
                                <div class="label-art" style="background-image: url('${row[4]}'); ${!tapID.toLowerCase().includes('tap') ? 'height:250px;' : ''}"></div>
                            ${untappdUrl ? `</a>` : ''}
                            <div class="details">
                                ${tapID.toLowerCase().includes('tap') ? `<div style="font-size:0.8rem; color:#888; letter-spacing:2px; margin-bottom:5px;">${tapID}</div>` : ''}
                                <div class="beer-name-row"><h2 class="beer-name">${bName}</h2>${avgBadge}</div>
                                <div class="stats"><span>${row[6]}</span><span>ABV: ${row[3]}</span></div>
                                ${tapID.toLowerCase().includes('tap') ? `<p class="description">${row[5]}</p>` : ''}
                                <div class="rating-box" id="box-${i}">
                                    <div class="stars">
                                        <input type="radio" id="s5-${i}" onclick="submitRating('${bName}', 5, ${i})"><label for="s5-${i}">★</label>
                                        <input type="radio" id="s4-${i}" onclick="submitRating('${bName}', 4, ${i})"><label for="s4-${i}">★</label>
                                        <input type="radio" id="s3-${i}" onclick="submitRating('${bName}', 3, ${i})"><label for="s3-${i}">★</label>
                                        <input type="radio" id="s2-${i}" onclick="submitRating('${bName}', 2, ${i})"><label for="s2-${i}">★</label>
                                        <input type="radio" id="s1-${i}" onclick="submitRating('${bName}', 1, ${i})"><label for="s1-${i}">★</label>
                                    </div>
                                </div>
                                ${tapID.toLowerCase().includes('tap') ? `
                                    <div class="volume-container"><div class="volume-bar" style="width:${pct}%"></div><div class="volume-text">${Math.round((pct/100)*41)} PINTS LEFT</div></div>
                                    <div class="tap-timestamp">Sync: ${universalSync}</div>
                                ` : ''}
                            </div>
                        </div>`;

                    if (tapID.toLowerCase().includes('tap')) {
                        tapContainer.innerHTML += cardHTML;
                    } else {
                        archiveContainer.innerHTML += cardHTML;
                    }
                });
            } catch (e) { console.error("Display Error: ", e); }
        }

        function toggleSection(id) {
            const el = document.getElementById(id);
            document.querySelectorAll('.expand-section').forEach(s => { if(s.id !== id) s.classList.remove('open'); });
            el.classList.toggle('open');
        }
        updateDisplay();
        setInterval(updateDisplay, 30000);
    </script>
</body>
</html>
