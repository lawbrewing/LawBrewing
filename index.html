<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Law Brewing Co. | Live Taproom</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Roboto:wght@300;400&family=Bebas+Neue&family=Roboto+Slab:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #ffb400; --bg: #121212; --card: #1e1e1e; --text: #ffffff; }
        body { background: var(--bg); color: var(--text); font-family: 'Roboto', sans-serif; margin: 0; padding-bottom: 80px; }
        .header-container { text-align: center; padding: 50px 0 30px; background: radial-gradient(circle, #2a2a2a 0%, #121212 80%); border-bottom: 2px solid var(--accent); }
        .backlit-logo { max-width: 280px; filter: drop-shadow(0 0 10px rgba(255,180,0,0.5)); }
        .sub-brand { font-family: 'Oswald', sans-serif; color: var(--accent); text-transform: uppercase; letter-spacing: 6px; margin-top: 15px; font-size: 1.5rem; }
        
        .tap-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 30px; max-width: 1300px; margin: 40px auto; padding: 20px; align-items: stretch; }
        .beer-card { background: var(--card); border-radius: 20px; border: 1px solid #333; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); height: 100%; position: relative; }
        
        /* TOP RATED RIBBON */
        .top-rated-ribbon { position: absolute; top: 20px; right: -35px; background: var(--accent); color: #000; padding: 5px 40px; transform: rotate(45deg); font-family: 'Oswald'; font-weight: bold; font-size: 0.8rem; letter-spacing: 1px; z-index: 10; box-shadow: 0 0 15px rgba(255,180,0,0.4); text-transform: uppercase; }

        .label-art { width: 100%; height: 350px; background-size: contain; background-repeat: no-repeat; background-position: center; background-color: #000; border-bottom: 3px solid var(--accent); }
        .details { padding: 25px; flex-grow: 1; display: flex; flex-direction: column; }
        .beer-name-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 5px; }
        .beer-name { font-family: 'Oswald', sans-serif; font-size: 2.1rem; margin: 0; text-transform: uppercase; line-height: 1.1; }
        .avg-badge { background: rgba(255,180,0,0.15); color: var(--accent); padding: 4px 10px; border-radius: 8px; font-size: 1.1rem; border: 1px solid rgba(255,180,0,0.4); font-family: 'Oswald'; font-weight: bold; white-space: nowrap; }

        .stats { font-family: 'Oswald', sans-serif; color: var(--accent); font-size: 1.1rem; margin: 10px 0; display: flex; justify-content: space-between; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .description { font-size: 0.95rem; color: #ccc; line-height: 1.5; margin-bottom: 20px; flex-grow: 1; white-space: pre-wrap; }
        
        .rating-box { background: rgba(255,255,255,0.03); padding: 12px; border-radius: 12px; margin-bottom: 20px; text-align: center; border: 1px solid #333; }
        .star-links { display: flex; justify-content: center; gap: 10px; flex-direction: row-reverse; }
        .star-links a { font-size: 2.2rem; color: #333; text-decoration: none; transition: 0.2s; line-height: 1; }
        .star-links a:hover, .star-links a:hover ~ a { color: var(--accent); transform: scale(1.1); text-shadow: 0 0 15px rgba(255,180,0,0.5); }

        .volume-container { background: #000; height: 32px; border-radius: 16px; position: relative; overflow: hidden; border: 2px solid #444; margin-top: auto; }
        .volume-bar { background: linear-gradient(90deg, #b8860b, var(--accent)); height: 100%; transition: width 1.5s ease; }
        .volume-text { position: absolute; width: 100%; text-align: center; top: 6px; font-weight: bold; font-size: 0.9rem; color: white; text-shadow: 1px 1px 3px black; }
        .tap-timestamp { font-size: 0.75rem; color: #777; text-align: center; margin-top: 10px; text-transform: uppercase; letter-spacing: 1.5px; font-weight: bold; border-top: 1px solid #2a2a2a; padding-top: 8px; }

        .button-center { display: flex; justify-content: center; gap: 20px; margin: 40px auto; flex-wrap: wrap; }
        .toggle-btn { padding: 12px 30px; background: transparent; border: 2px solid var(--accent); color: var(--accent); font-family: 'Oswald'; cursor: pointer; border-radius: 50px; text-transform: uppercase; letter-spacing: 1px; transition: 0.3s; }
        .toggle-btn:hover { background: var(--accent); color: #000; }
        .expand-section { max-height: 0; overflow: hidden; transition: max-height 0.8s ease-out; background: rgba(0,0,0,0.3); }
        .expand-section.open { max-height: 20000px; padding: 40px 0; }
        
        .games-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; max-width: 1300px; margin: 0 auto; padding: 0 20px; }
        .game-card { background: #202020; border-radius: 15px; border: 1px solid #444; overflow: hidden; display: flex; flex-direction: column; }
        .game-img { width: 100%; height: 200px; object-fit: contain; background: #000; padding: 10px; }
        .game-btn { display: block; background: var(--accent); color: #1a1a1a; padding: 12px; text-align: center; text-decoration: none; font-family: 'Bebas Neue', sans-serif; font-size: 1.4rem; }
        .archive-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 25px; max-width: 1300px; margin: 0 auto; padding: 20px; }
    </style>
</head>
<body>
    <div class="header-container">
        <img src="https://github.com/lawbrewing/LawBrewing/blob/main/LBC%20-%20Black%20Transparent%20(1).png?raw=true" alt="Law Brewing" class="backlit-logo">
        <div class="sub-brand">Liquid Attitude Taps</div>
    </div>
    <div class="tap-container" id="tap-display"></div>
    <div class="button-center">
        <button class="toggle-btn" onclick="toggleSection('archive-wrapper')">View The Cellar</button>
        <button class="toggle-btn" onclick="toggleSection('game-wrapper')">Bar Games</button>
    </div>
    <div id="archive-wrapper" class="expand-section">
        <h2 style="text-align:center; font-family:'Oswald'; color:var(--accent); letter-spacing:4px; font-size:2.5rem; margin-bottom:30px;">PAST BREWS & BOTTLES</h2>
        <div class="archive-grid" id="archive-display"></div>
    </div>
    <div id="game-wrapper" class="expand-section">
        <div class="games-grid">
            <div class="game-card"><img src="https://github.com/lawbrewing/LawBrewing/blob/main/Gemini_Generated_Image_f46i9af46i9af46i.png?raw=true" class="game-img"><div style="padding:20px; text-align:center;"><h3 style="color:white; font-family:'Roboto Slab'; font-size:1.2rem;">Sheriff of Taps</h3><a href="defender.html" class="game-btn">Play Defender</a></div></div>
            <div class="game-card"><img src="1766341219164~2.jpg" class="game-img"><div style="padding:20px; text-align:center;"><h3 style="color:white; font-family:'Roboto Slab'; font-size:1.2rem;">Beer Flight Card Game</h3><a href="Thetaproom.html" class="game-btn">Play Taproom</a></div></div>
            <div class="game-card"><img src="https://github.com/lawbrewing/LawBrewing/blob/main/bardice%20(2).png?raw=true" class="game-img"><div style="padding:20px; text-align:center;"><h3 style="color:white; font-family:'Roboto Slab'; font-size:1.2rem;">Bar Dice</h3><a href="bardice.html" class="game-btn">Play Bar Dice</a></div></div>
            <div class="game-card"><img src="https://github.com/lawbrewing/LawBrewing/blob/main/ttt.png?raw=true" class="game-img"><div style="padding:20px; text-align:center;"><h3 style="color:white; font-family:'Roboto Slab'; font-size:1.2rem;">Tic Tac Toe</h3><a href="tictactoe.html" class="game-btn">Play Tic Tac Toe</a></div></div>
            <div class="game-card"><img src="https://github.com/lawbrewing/LawBrewing/blob/main/taproomchaos.png?raw=true" class="game-img"><div style="padding:20px; text-align:center;"><h3 style="color:white; font-family:'Roboto Slab'; font-size:1.2rem;">Taproom Chaos</h3><a href="taproomchaosgame.html" class="game-btn">Play Chaos</a></div></div>
        </div>
    </div>

    <script>
        const FORM_BASE = "https://docs.google.com/forms/d/e/1FAIpQLSfx4apNIy6wi1CrFW-B8u01vJ_2ci1fcStPSWcWLFK9DpRs8g/viewform";
        const ENTRY_BEER = "entry.1650190471";
        const ENTRY_SCORE = "entry.958548151";
        const MAIN_CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQWqyJ5-pMWhRUkkZLoHdmFPtOHJozHRJkL9c0ivSSY9J7Fp0lto4W05tH-XbFelBL-htJZXedhv7i3/pub?output=csv';
        const SCOREBOARD_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRHD6zTvSE5HfErbLPAHhb0NyXDLuvt_cpOEQxr76BFNpN-KgbL3y68LIogt1aEhVAxIP4JU9t1Kte1/pub?gid=1912157964&single=true&output=csv";

        function parseCSV(data) {
            const result = []; let row = []; let col = ''; let inQuotes = false;
            for (let i = 0; i < data.length; i++) {
                let char = data[i], next = data[i+1];
                if (char === '"' && inQuotes && next === '"') { col += '"'; i++; }
                else if (char === '"') { inQuotes = !inQuotes; }
                else if (char === ',' && !inQuotes) { row.push(col); col = ''; }
                else if (char === '\n' && !inQuotes) { row.push(col); result.push(row); row = []; col = ''; }
                else { col += char; }
            }
            if (col || row.length) { row.push(col); result.push(row); }
            return result;
        }

        async function updateDisplay() {
            try {
                const cb = new Date().getTime();
                const [wRes, mRes] = await Promise.all([
                    fetch('tap_weights.json?t=' + cb),
                    fetch(MAIN_CSV + '&t=' + cb)
                ]);
                
                let ratingMap = {};
                let maxRating = 0;
                let topBeer = "";

                try {
                    const rRes = await fetch(SCOREBOARD_URL + '&t=' + cb);
                    const ratingText = await rRes.text();
                    if (ratingText && !ratingText.includes("DOCTYPE")) {
                        parseCSV(ratingText).forEach(r => {
                            if(r[0] && r[1]) {
                                const score = parseFloat(r[1]);
                                ratingMap[r[0].trim()] = score.toFixed(1);
                                if (score > maxRating) {
                                    maxRating = score;
                                    topBeer = r[0].trim();
                                }
                            }
                        });
                    }
                } catch(e) {}

                const weights = await wRes.json();
                const beerData = parseCSV(await mRes.text());
                const tapContainer = document.getElementById('tap-display');
                const archiveContainer = document.getElementById('archive-display');
                tapContainer.innerHTML = ''; archiveContainer.innerHTML = '';

                let universalSync = weights["last_updated"] || weights["updated"] || weights["time"] || "--:--";

                beerData.forEach((row, i) => {
                    if (i === 0 || row.length < 3) return;
                    const tapID = (row[0] || "").trim();
                    const bName = (row[2] || "").trim();
                    if (!bName) return;

                    const isTop = (bName === topBeer && maxRating > 0);
                    const topRibbon = isTop ? `<div class="top-rated-ribbon">Top Rated</div>` : '';
                    const avg = ratingMap[bName] ? `<span class="avg-badge">⭐ ${ratingMap[bName]}</span>` : '';
                    const getRatingLink = (val) => `${FORM_BASE}?usp=pp_url&${ENTRY_BEER}=${encodeURIComponent(bName)}&${ENTRY_SCORE}=${val}`;

                    const ratingHTML = `
                        <div class="rating-box">
                            <span style="font-size:0.75rem; color:#888; text-transform:uppercase; display:block; margin-bottom:10px; font-weight:bold;">Rate This Brew</span>
                            <div class="star-links">
                                <a href="${getRatingLink(5)}" target="_blank">★</a>
                                <a href="${getRatingLink(4)}" target="_blank">★</a>
                                <a href="${getRatingLink(3)}" target="_blank">★</a>
                                <a href="${getRatingLink(2)}" target="_blank">★</a>
                                <a href="${getRatingLink(1)}" target="_blank">★</a>
                            </div>
                        </div>`;

                    if (tapID.toLowerCase().includes("tap")) {
                        const pct = weights[tapID] || 0;
                        tapContainer.innerHTML += `
                            <div class="beer-card">
                                ${topRibbon}
                                <div class="label-art" style="background-image: url('${row[4]}');"></div>
                                <div class="details">
                                    <div style="font-size:0.8rem; color:#888; letter-spacing:2px; margin-bottom:5px;">${tapID}</div>
                                    <div class="beer-name-row">
                                        <h2 class="beer-name">${bName}</h2>
                                        ${avg}
                                    </div>
                                    <div class="stats"><span>${row[6]}</span><span>ABV: ${row[3]}</span></div>
                                    <p class="description">${row[5]}</p>
                                    ${ratingHTML}
                                    <div class="volume-container"><div class="volume-bar" style="width:${pct}%"></div><div class="volume-text">${Math.round((pct/100)*41)} PINTS LEFT</div></div>
                                    <div class="tap-timestamp">Sync: ${universalSync}</div>
                                </div>
                            </div>`;
                    } else {
                        archiveContainer.innerHTML += `
                            <div class="beer-card">
                                ${topRibbon}
                                <div class="label-art" style="height:250px; background-image: url('${row[4]}');"></div>
                                <div class="details">
                                    <div class="beer-name-row">
                                        <h2 class="beer-name" style="font-size:1.5rem;">${bName}</h2>
                                        ${avg}
                                    </div>
                                    <div class="stats"><span>${row[6]}</span><span>ABV: ${row[3]}</span></div>
                                    ${ratingHTML}
                                </div>
                            </div>`;
                    }
                });
            } catch (e) { console.error(e); }
        }

        function toggleSection(id) {
            const el = document.getElementById(id);
            document.querySelectorAll('.expand-section').forEach(s => { if(s.id !== id) s.classList.remove('open'); });
            el.classList.toggle('open');
        }
        updateDisplay();
        setInterval(updateDisplay, 30000);
    </script>
</body>
</html>
