<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Law Brewing | Live Taproom</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Roboto:wght@300;400&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #ffb400; --bg: #121212; --card: #1e1e1e; --text: #ffffff; }
        body { background: var(--bg); color: var(--text); font-family: 'Roboto', sans-serif; margin: 0; padding-bottom: 50px; }
        
        /* Navigation */
        nav { background: #000; padding: 15px; text-align: center; border-bottom: 1px solid #333; }
        nav a { color: var(--accent); text-decoration: none; margin: 0 20px; font-family: 'Oswald'; letter-spacing: 1px; font-weight: bold; }
        
        .header-container { text-align: center; padding: 40px 0; background: radial-gradient(circle, #2a2a2a 0%, #121212 80%); }
        .backlit-logo { max-width: 250px; filter: drop-shadow(0 0 10px rgba(255,180,0,0.4)); }
        
        .tap-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 25px; max-width: 1200px; margin: 0 auto; padding: 20px; }
        
        .beer-card { background: var(--card); border-radius: 20px; overflow: hidden; border: 1px solid #333; box-shadow: 0 10px 30px rgba(0,0,0,0.5); transition: 0.3s; }
        .beer-card:hover { border-color: var(--accent); }

        .label-art { width: 100%; height: 280px; background-size: cover; background-position: center; border-bottom: 3px solid var(--accent); background-color: #222; }
        
        .details { padding: 20px; text-align: center; }
        .beer-name { font-family: 'Oswald'; font-size: 2rem; margin: 0; color: var(--accent); text-transform: uppercase; line-height: 1.1; }
        .abv { font-family: 'Oswald'; font-size: 1rem; color: #888; margin: 10px 0; }
        
        /* Progress Bar */
        .volume-container { background: #000; height: 35px; border-radius: 18px; position: relative; overflow: hidden; border: 1px solid #444; margin: 20px 0; }
        .volume-bar { background: linear-gradient(90deg, #b8860b, var(--accent)); height: 100%; width: 0%; transition: width 1.5s ease-in-out; }
        .volume-text { position: absolute; width: 100%; text-align: center; top: 7px; font-weight: bold; font-size: 1rem; color: white; text-shadow: 1px 1px 3px black; }
        
        /* Stats Grid */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; border-top: 1px solid #333; padding-top: 15px; }
        .stat-box { font-family: 'Oswald'; }
        .stat-val { font-size: 1.8rem; color: var(--accent); display: block; }
        .stat-label { font-size: 0.7rem; color: #666; letter-spacing: 1px; text-transform: uppercase; }

        footer { margin-top: 50px; padding: 30px; text-align: center; border-top: 1px solid #222; }
        footer a { color: #222; text-decoration: none; font-size: 0.7rem; } /* Subtle Admin Link */
    </style>
</head>
<body>

    <nav>
        <a href="index.html">LIVE TAPS</a>
        <a href="archive.html">BEER VAULT</a>
    </nav>

    <div class="header-container">
        <img src="https://github.com/lawbrewing/LawBrewing/blob/main/LBC%20-%20Black%20Transparent%20(1).png?raw=true" class="backlit-logo" alt="Law Brewing Co">
    </div>

    <div class="tap-container" id="tap-display">
        </div>

    <footer>
        <p style="color: #444; font-size: 0.8rem;">&copy; 2025 Law Brewing | Liquid Attitude</p>
        <a href="http://192.168.86.44:5000/admin">ADMIN LOGIN</a>
    </footer>

    <script>
        async function fetchTaps() {
            // Cache Buster (?t=) ensures we get the newest data from GitHub
            const url = 'taps.json?t=' + Math.random();
            
            try {
                const response = await fetch(url);
                const taps = await response.json();
                
                const container = document.getElementById('tap-display');
                container.innerHTML = '';

                // Must match the keys in your taps.json exactly
                const hardwareTaps = ["Law Tap", "Wisco Tap", "Nitro Tap"];

                hardwareTaps.forEach(id => {
                    const data = taps[id];
                    
                    // Only display if a beer is assigned
                    if (data && data.beer_id !== "none") {
                        
                        // Handle the Pints/Growlers (round to 1 decimal)
                        const pints = data.pints || 0;
                        const growlers = data.growlers || 0;
                        const percent = data.percent || 0;

                        container.innerHTML += `
                            <div class="beer-card">
                                <div class="label-art" style="background-image: url('${data.img || 'assets/default.png'}');"></div>
                                <div class="details">
                                    <h2 class="beer-name">${data.beer_name}</h2>
                                    <div class="abv">${data.abv || 'N/A'} | ${id}</div>
                                    
                                    <div class="volume-container">
                                        <div class="volume-bar" style="width: ${percent}%"></div>
                                        <div class="volume-text">${percent}% REMAINING</div>
                                    </div>

                                    <div class="stats-grid">
                                        <div class="stat-box">
                                            <span class="stat-val">${pints}</span>
                                            <span class="stat-label">PINTS LEFT</span>
                                        </div>
                                        <div class="stat-box">
                                            <span class="stat-val">${growlers}</span>
                                            <span class="stat-label">GROWLERS</span>
                                        </div>
                                    </div>
                                    
                                    <p style="color: #ffb400; font-family: 'Oswald'; margin-top: 20px; font-size: 1.2rem;">
                                        Rating: ${data.rating || '5.0'} ⭐
                                    </p>
                                </div>
                            </div>
                        `;
                    }
                });
            } catch (e) {
                console.error("Dashboard failed to update:", e);
            }
        }

        // Refresh every 5 seconds
        setInterval(fetchTaps, 5000);
        fetchTaps();
    </script>
</body>
</html>
