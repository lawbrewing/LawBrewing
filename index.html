<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Law Brewing - Live Taps</title>
    <style>
        :root {
            --gold: #f1c40f;
            --dark-bg: #0a0a0a;
            --card-bg: #161616;
        }
        body { background: var(--dark-bg); color: white; font-family: sans-serif; text-align: center; margin: 0; }
        header { padding: 40px; }
        .glowing-logo { color: var(--gold); font-size: 3rem; letter-spacing: 10px; text-shadow: 0 0 15px rgba(241, 196, 15, 0.5); }
        
        .tap-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: auto;
            padding: 20px;
        }

        .tap-card {
            background: var(--card-bg);
            border: 1px solid #333;
            border-radius: 15px;
            padding: 20px;
        }

        .tap-name { font-size: 1.5rem; font-weight: bold; color: var(--gold); margin-bottom: 20px; }

        /* Progress Bar */
        .bar-outer {
            background: #000;
            height: 40px;
            border-radius: 20px;
            border: 1px solid #444;
            overflow: hidden;
            position: relative;
            margin-top: 10px;
        }
        .bar-inner {
            background: linear-gradient(90deg, #b8860b, var(--gold));
            height: 100%;
            transition: width 1s ease-in-out;
        }
        .bar-text {
            position: absolute; width: 100%; top: 0; left: 0;
            line-height: 40px; font-weight: bold; font-size: 1rem;
            color: white; text-shadow: 1px 1px 2px black;
        }
    </style>
</head>
<body>

    <header>
        <h1 class="glowing-logo">LAW BREWING</h1>
    </header>

    <div id="tap-display" class="tap-container">
        </div>

    <script>
        async function updateTaps() {
            try {
                // Fetch only the weights
                const response = await fetch('tap_weights.json?t=' + Date.now());
                const weights = await response.json();
                
                const display = document.getElementById('tap-display');
                display.innerHTML = '';

                // List the keys exactly as they appear in your Python TAP_CONFIG
                const tapNames = ["Law Tap", "Wisco Tap", "Nitro Tap"];

                tapNames.forEach(name => {
                    const percent = weights[name] || 0;
                    
                    display.innerHTML += `
                        <div class="tap-card">
                            <div class="tap-name">${name.toUpperCase()}</div>
                            <div class="bar-outer">
                                <div class="bar-inner" style="width: ${percent}%"></div>
                                <div class="bar-text">${percent}% FULL</div>
                            </div>
                        </div>
                    `;
                });
            } catch (e) {
                console.error("Waiting for weights...", e);
            }
        }

        setInterval(updateTaps, 5000); // Check every 5 seconds
        updateTaps();
    </script>
</body>
</html>
