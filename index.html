<!DOCTYPE html>
<html>
<head>
    <title>Law Brewing Taproom</title>
    <style>
        :root { --gold: #d4a017; --bg: #0a0a0a; --card: #161616; }
        body { background: var(--bg); color: #fff; font-family: 'Arial Black', sans-serif; margin: 0; padding: 0; }
        
        /* Restored Cool Header */
        .header { 
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('images/labels/brewery-bg.jpg');
            background-size: cover; background-position: center;
            padding: 60px 20px; text-align: center; border-bottom: 5px solid var(--gold);
        }
        .header h1 { font-size: 4em; margin: 0; color: var(--gold); letter-spacing: 8px; text-shadow: 3px 3px #000; }
        .header p { font-size: 1.2em; letter-spacing: 4px; color: #eee; margin-top: 10px; }

        .tap-grid { display: flex; justify-content: center; gap: 40px; padding: 50px; flex-wrap: wrap; }
        
        .card { 
            background: var(--card); border: 2px solid #333; border-radius: 0; 
            width: 350px; padding: 0; position: relative; box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }
        .tap-num { 
            position: absolute; top: -20px; left: -20px; background: var(--gold); 
            color: #000; width: 60px; height: 60px; line-height: 60px; font-size: 2em; font-weight: bold; 
        }
        .art { width: 100%; height: 350px; object-fit: cover; filter: grayscale(20%) contrast(1.1); }
        
        .info { padding: 25px; text-align: left; }
        h2 { margin: 0; font-size: 2em; text-transform: uppercase; line-height: 1; }
        .abv { color: var(--gold); font-size: 1.2em; margin: 10px 0; }
        .desc { font-family: 'Helvetica', sans-serif; color: #bbb; font-size: 0.9em; height: 50px; overflow: hidden; }

        /* Restored Weight Gauges */
        .weight-track { background: #222; height: 40px; margin-top: 20px; position: relative; border: 1px solid #444; }
        .weight-fill { 
            background: linear-gradient(90deg, #800000 0%, var(--gold) 100%); 
            height: 100%; transition: width 2s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        .weight-label { 
            position: absolute; width: 100%; text-align: center; top: 0; 
            line-height: 40px; font-weight: bold; font-size: 0.9em; text-shadow: 1px 1px #000; 
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>LAW BREWING</h1>
        <p>EST 2024 • FOX CROSSING, WI</p>
    </div>

    <div class="tap-grid" id="display"></div>

    <script>
        async function load() {
            const r = await fetch('taps.json?t=' + Date.now());
            const d = await r.json();
            const grid = document.getElementById('display');
            grid.innerHTML = '';

            Object.entries(d.active_taps).forEach(([tap, beerName], index) => {
                const beer = d.library[beerName] || { abv: '0%', desc: '', artwork: 'logo.png', percent: 0 };
                grid.innerHTML += `
                    <div class="card">
                        <div class="tap-num">${index + 1}</div>
                        <img src="images/labels/${beer.artwork}" class="art">
                        <div class="info">
                            <h2>${beerName}</h2>
                            <div class="abv">${beer.abv} ABV</div>
                            <p class="desc">${beer.desc}</p>
                            <div class="weight-track">
                                <div class="weight-fill" style="width: ${beer.percent}%"></div>
                                <div class="weight-label">${beer.percent}% REMAINING</div>
                            </div>
                        </div>
                    </div>`;
            });
        }
        load();
        setInterval(load, 30000);
    </script>
</body>
</html>
