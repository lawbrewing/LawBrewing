<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Law Brewing - Live Taps</title>
    <style>
        :root {
            --gold: #f1c40f;
            --dark-bg: #121212;
            --card-bg: #1e1e1e;
        }

        body {
            background-color: var(--dark-bg);
            color: white;
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        h1 { color: var(--gold); letter-spacing: 2px; margin-bottom: 30px; }

        .tap-container {
            display: flex;
            flex-direction: column;
            gap: 30px;
            max-width: 600px;
            margin: 0 auto;
        }

        .tap-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 25px;
            border: 1px solid #333;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        .beer-label {
            width: 200px;
            height: 200px;
            object-fit: cover;
            border-radius: 15px;
            border: 2px solid var(--gold);
            margin-bottom: 15px;
        }

        .beer-name { font-size: 1.8rem; font-weight: bold; margin: 10px 0; }
        .beer-style { color: #888; margin-bottom: 20px; }

        /* Progress Bar (Kegerator Level) */
        .progress-container {
            background: #333;
            border-radius: 20px;
            height: 35px;
            width: 100%;
            position: relative;
            overflow: hidden;
            border: 1px solid #444;
        }

        .progress-fill {
            background: linear-gradient(90deg, #d4ae0b, var(--gold));
            height: 100%;
            transition: width 1s ease-in-out;
        }

        .progress-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-weight: bold;
            text-shadow: 1px 1px 2px black;
        }

        .footer-links { margin-top: 50px; }
        .footer-links a { color: var(--gold); text-decoration: none; margin: 0 15px; }
    </style>
</head>
<body>

    <h1>LAW BREWING LIVE</h1>

    <div id="tap-display" class="tap-container">
        <p>Loading the vault...</p>
    </div>

    <div class="footer-links">
        <a href="library.html">Beer Vault</a>
        <a href="https://untappd.com/v/law-brewing/123456">Untappd</a>
    </div>

    <script>
        // Configuration: Which Beer ID is on which Tap?
        // In the future, your Pi can update this JSON file automatically.
        const tapConfig = [
            { id: "5657071", percent: 85, tapName: "Law Tap" },
            { id: "none", percent: 0, tapName: "Wisco Tap" },
            { id: "none", percent: 0, tapName: "Nitro Tap" }
        ];

        async function loadTaps() {
            try {
                const response = await fetch('library.json');
                const library = await response.json();
                const display = document.getElementById('tap-display');
                display.innerHTML = ''; // Clear loading text

                tapConfig.forEach(tap => {
                    const beer = library[tap.id];
                    
                    if (beer) {
                        // Logic to handle .jpeg vs .png (Public version)
                        // We assume images are named [ID].jpeg as found on your Pi
                        const imgUrl = `static/images/library/${tap.id}.jpeg`;

                        display.innerHTML += `
                            <div class="tap-card">
                                <div style="color: var(--gold); font-weight: bold;">${tap.tapName}</div>
                                <div class="beer-name">${beer.name}</div>
                                <div class="beer-style">${beer.abv} | ${beer.style}</div>
                                <img src="${imgUrl}" class="beer-label" onerror="this.src='static/images/library/placeholder.png'">
                                <div class="progress-container">
                                    <div class="progress-fill" style="width: ${tap.percent}%"></div>
                                    <div class="progress-text">${tap.percent}% Remaining</div>
                                </div>
                            </div>
                        `;
                    }
                });
            } catch (error) {
                console.error("Error loading library:", error);
                document.getElementById('tap-display').innerHTML = "<p>Error connecting to the Beer Vault.</p>";
            }
        }

        loadTaps();
    </script>
</body>
</html>
