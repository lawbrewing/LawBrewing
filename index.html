<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Law Brewing Co. | Live Taproom</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Roboto:wght@300;400&display=swap" rel="stylesheet">
    <style>
        :root { 
            --accent: #ffb400; 
            --bg: #121212; 
            --card: #1e1e1e; 
            --text: #ffffff;
        }

        body { 
            background: var(--bg); 
            color: var(--text); 
            font-family: 'Roboto', sans-serif; 
            margin: 0; 
            padding-bottom: 50px;
        }

        /* BACKLIT LOGO HEADER */
        .header-container {
            text-align: center;
            padding: 50px 0 30px;
            background: radial-gradient(circle, #2a2a2a 0%, #121212 80%);
            border-bottom: 2px solid var(--accent);
            margin-bottom: 40px;
        }

        .backlit-logo {
            max-width: 280px;
            filter: drop-shadow(0 0 10px rgba(255, 180, 0, 0.5)) 
                    drop-shadow(0 0 25px rgba(255, 180, 0, 0.2));
        }

        .sub-brand {
            font-family: 'Oswald', sans-serif;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 6px;
            margin-top: 15px;
            font-size: 1.5rem;
        }

        .tap-container { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); 
            gap: 30px; 
            max-width: 1200px; 
            margin: 0 auto; 
            padding: 20px;
        }

        .beer-card { 
            background: var(--card); 
            border-radius: 20px; 
            overflow: hidden; 
            border: 1px solid #333;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
        }

        .label-art { 
            width: 100%; 
            height: 350px; 
            background-size: contain; 
            background-repeat: no-repeat;
            background-position: center; 
            background-color: #000;
            border-bottom: 3px solid var(--accent); 
        }

        .details { padding: 25px; flex-grow: 1; display: flex; flex-direction: column; }

        .stats { 
            font-family: 'Oswald', sans-serif; 
            color: var(--accent); 
            font-size: 1.1rem; 
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .tap-id-tag {
            font-size: 0.8rem;
            color: #888;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .beer-name { 
            font-family: 'Oswald', sans-serif; 
            font-size: 2.2rem; 
            margin: 0 0 10px 0; 
            text-transform: uppercase;
            line-height: 1.1;
        }

        .description { 
            font-size: 1rem; 
            color: #ccc; 
            line-height: 1.6; 
            margin-bottom: 20px; 
            white-space: pre-wrap; 
        }

        .volume-container { 
            background: #000; 
            height: 35px; 
            border-radius: 17px; 
            position: relative; 
            overflow: hidden; 
            border: 1px solid #444;
            margin-top: auto; 
        }

        .volume-bar { 
            background: linear-gradient(90deg, #b8860b, var(--accent)); 
            height: 100%; 
            width: 0%; 
            transition: width 1.5s cubic-bezier(0.1, 0.7, 1.0, 0.1); 
        }

        .volume-text { 
            position: absolute; 
            width: 100%; 
            text-align: center; 
            top: 7px; 
            font-weight: bold; 
            font-size: 1rem; 
            color: white;
            text-shadow: 1px 1px 3px black;
        }
    </style>
</head>
<body>

    <div class="header-container">
        <img src="https://github.com/lawbrewing/LawBrewing/blob/main/LBC%20-%20Black%20Transparent%20(1).png?raw=true" 
             alt="Law Brewing Logo" 
             class="backlit-logo">
        <div class="sub-brand">Liquid Attitude Taps</div>
    </div>

    <div class="tap-container" id="tap-display"></div>

    <script>
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQWqyJ5-pMWhRUkkZLoHdmFPtOHJozHRJkL9c0ivSSY9J7Fp0lto4W05tH-XbFelBL-htJZXedhv7i3/pub?output=csv';

        function parseCSV(str) {
            const rows = [];
            let quote = false, col = "", row = [];
            for (let c = 0; c < str.length; c++) {
                let char = str[c], next = str[c+1];
                if (char == '"' && quote && next == '"') { col += char; c++; continue; }
                if (char == '"') { quote = !quote; continue; }
                if (char == ',' && !quote) { row.push(col.trim()); col = ""; continue; }
                if (char == '\n' && !quote) { row.push(col.trim()); rows.push(row); col = ""; row = []; continue; }
                col += char;
            }
            row.push(col.trim()); rows.push(row);
            return rows;
        }

        async function updateDisplay() {
            try {
                const cacheBuster = new Date().getTime();
                const [wRes, sRes] = await Promise.all([
                    fetch('tap_weights.json?t=' + cacheBuster),
                    fetch(CSV_URL + '&t=' + cacheBuster)
                ]);

                const weights = await wRes.json();
                const sheetText = await sRes.text();
                const csvData = parseCSV(sheetText);
                
                const container = document.getElementById('tap-display');
                container.innerHTML = '';

                for (let i = 1; i < csvData.length; i++) {
                    const row = csvData[i];
                    if (!row[0] || row[0] === "") continue;

                    // UPDATED MAPPING:
                    // We define exactly which column is which based on your sheet layout
                    const tapID   = row[0]; // "Law Tap"
                    const beerID  = row[1]; // The ID we want to HIDE (5657071)
                    const bName   = row[2]; // "Angels With Filthy Souls"
                    const bStyle  = row[3]; // "Winter Warmer"
                    const bABV    = row[4]; // "8.20%"
                    const bImage  = row[5]; // URL
                    const bDesc   = row[6]; // Description

                    const pct = weights[tapID] || 0;

                    container.innerHTML += `
                        <div class="beer-card">
                            <div class="label-art" style="background-image: url('${bImage}');"></div>
                            <div class="details">
                                <div class="tap-id-tag">${tapID}</div>
                                <div class="stats">${bStyle} | ABV: ${bABV}</div>
                                <h2 class="beer-name">${bName}</h2>
                                <p class="description">${bDesc}</p>
                                
                                <div class="volume-container">
                                    <div class="volume-bar" style="width: ${pct}%"></div>
                                    <div class="volume-text">${pct}% REMAINING</div>
                                </div>
                            </div>
                        </div>
                    `;
                }
            } catch (err) {
                console.log("Updating Taps...");
            }
        }

        setInterval(updateDisplay, 15000);
        updateDisplay();
    </script>
</body>
</html>
