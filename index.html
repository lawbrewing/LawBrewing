<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Law Brewing - Live Dashboard</title>
    <style>
        :root {
            --gold: #f1c40f;
            --dark-bg: #121212;
            --card-bg: #1e1e1e;
        }

        body {
            background-color: var(--dark-bg);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        /* Restored Header Section */
        header {
            padding: 50px 20px;
            background: linear-gradient(to bottom, #1a1a1a, var(--dark-bg));
            border-bottom: 1px solid #333;
        }

        h1 { margin: 0; color: var(--gold); letter-spacing: 4px; font-size: 2.5rem; text-transform: uppercase; }
        .subtitle { color: #888; margin-top: 10px; font-style: italic; letter-spacing: 1px; }

        .tap-container {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            display: grid;
            gap: 30px;
        }

        .tap-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid #333;
            transition: transform 0.3s ease;
            position: relative;
        }

        .tap-card:hover { transform: translateY(-5px); border-color: var(--gold); }

        .tap-number {
            position: absolute;
            top: 15px;
            left: 20px;
            color: var(--gold);
            font-weight: bold;
            font-size: 0.9rem;
            text-transform: uppercase;
        }

        .beer-label {
            width: 220px;
            height: 220px;
            object-fit: cover;
            border-radius: 15px;
            border: 2px solid var(--gold);
            margin: 15px 0;
            cursor: pointer;
        }

        .beer-name { font-size: 2rem; font-weight: bold; margin: 5px 0; }
        .beer-style { color: var(--gold); font-size: 1.1rem; margin-bottom: 20px; opacity: 0.8; }

        /* Kegerator Level Bars */
        .progress-bg {
            background: #333;
            border-radius: 25px;
            height: 40px;
            width: 100%;
            position: relative;
            overflow: hidden;
            border: 1px solid #444;
        }

        .progress-fill {
            background: linear-gradient(90deg, #b8860b, var(--gold));
            height: 100%;
            transition: width 1.5s ease-out;
        }

        .progress-text {
            position: absolute;
            width: 100%;
            top: 0;
            left: 0;
            line-height: 40px;
            font-weight: bold;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
        }

        .footer-nav {
            margin: 60px 0;
            padding-bottom: 40px;
        }

        .footer-nav a {
            color: var(--gold);
            text-decoration: none;
            margin: 0 20px;
            font-weight: bold;
            font-size: 1.1rem;
            border: 1px solid var(--gold);
            padding: 10px 20px;
            border-radius: 5px;
            transition: 0.3s;
        }

        .footer-nav a:hover { background: var(--gold); color: black; }
    </style>
</head>
<body>

    <header>
        <h1>LAW BREWING</h1>
        <div class="subtitle">Live Taproom Dashboard</div>
    </header>

    <div id="tap-display" class="tap-container">
        </div>

    <div class="footer-nav">
        <a href="library.html">The Beer Vault</a>
        <a href="https://untappd.com/brewery/536123" target="_blank">Untappd Profile</a>
    </div>

    <script>
        // MASTER CONFIGURATION
        // This tells the website which Beer ID is on which tap and the weight
        const tapConfig = [
            { tapNum: 1, tapName: "Law Tap",   id: "5657071", percent: 85 },
            { tapNum: 2, tapName: "Wisco Tap", id: "none",    percent: 0  },
            { tapNum: 3, tapName: "Nitro Tap", id: "none",    percent: 0  }
        ];

        async function initDashboard() {
            try {
                const response = await fetch('library.json');
                const library = await response.json();
                const display = document.getElementById('tap-display');
                display.innerHTML = ''; 

                tapConfig.forEach(tap => {
                    const beer = library[tap.id];
                    
                    if (beer) {
                        // Dynamically links to the specific beer on Untappd
                        const untappdUrl = `https://untappd.com/beer/${tap.id}`;
                        const imgUrl = `static/images/library/${tap.id}.jpeg`;

                        display.innerHTML += `
                            <div class="tap-card">
                                <div class="tap-number">${tap.tapName}</div>
                                <div class="beer-name">${beer.name}</div>
                                <div class="beer-style">${beer.abv} | ${beer.style}</div>
                                <a href="${untappdUrl}" target="_blank">
                                    <img src="${imgUrl}" class="beer-label" title="View on Untappd"
                                         onerror="this.src='static/images/library/placeholder.png'">
                                </a>
                                <div class="progress-bg">
                                    <div class="progress-fill" style="width: ${tap.percent}%"></div>
                                    <div class="progress-text">${tap.percent}% REMAINING</div>
                                </div>
                            </div>
                        `;
                    } else {
                        // Placeholder for Empty Taps
                        display.innerHTML += `
                            <div class="tap-card" style="opacity: 0.5;">
                                <div class="tap-number">${tap.tapName}</div>
                                <div class="beer-name">Tapped Out</div>
                                <div class="beer-style">Check back soon</div>
                                <div class="progress-bg"><div class="progress-fill" style="width: 0%"></div></div>
                            </div>
                        `;
                    }
                });
            } catch (e) {
                console.error("Dashboard Load Error:", e);
            }
        }

        initDashboard();
    </script>
</body>
</html>
