<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Law Brewing Co. | Live Taproom</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Roboto:wght@300;400&family=Bebas+Neue&family=Roboto+Slab:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #ffb400; --bg: #121212; --card: #1e1e1e; --text: #ffffff; }
        body { background: var(--bg); color: var(--text); font-family: 'Roboto', sans-serif; margin: 0; padding-bottom: 80px; }
        .header-container { text-align: center; padding: 50px 0 30px; background: radial-gradient(circle, #2a2a2a 0%, #121212 80%); border-bottom: 2px solid var(--accent); }
        .backlit-logo { max-width: 280px; filter: drop-shadow(0 0 10px rgba(255,180,0,0.5)); }
        .sub-brand { font-family: 'Oswald', sans-serif; color: var(--accent); text-transform: uppercase; letter-spacing: 6px; margin-top: 15px; font-size: 1.5rem; }
        
        /* GRID & CARDS */
        .tap-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 30px; max-width: 1300px; margin: 40px auto; padding: 20px; }
        .beer-card { background: var(--card); border-radius: 20px; border: 1px solid #333; display: flex; flex-direction: column; overflow: hidden; }
        .label-art { width: 100%; height: 350px; background-size: contain; background-repeat: no-repeat; background-position: center; background-color: #000; border-bottom: 3px solid var(--accent); }
        .details { padding: 25px; flex-grow: 1; display: flex; flex-direction: column; }
        .beer-name { font-family: 'Oswald', sans-serif; font-size: 2.2rem; margin: 0; text-transform: uppercase; }
        .stats { font-family: 'Oswald', sans-serif; color: var(--accent); font-size: 1.1rem; margin: 10px 0; display: flex; justify-content: space-between; border-bottom: 1px solid #333; padding-bottom: 10px; }
        
        .volume-container { background: #000; height: 38px; border-radius: 19px; position: relative; overflow: hidden; border: 2px solid #444; margin-top: auto; }
        .volume-bar { background: linear-gradient(90deg, #b8860b, var(--accent)); height: 100%; transition: width 1.5s ease; }
        .volume-text { position: absolute; width: 100%; text-align: center; top: 8px; font-weight: bold; color: white; text-shadow: 1px 1px 3px black; }
        .tap-timestamp { font-size: 0.75rem; color: #666; text-align: center; margin-top: 8px; text-transform: uppercase; }

        /* MULTI-BUTTON CENTER */
        .button-center { display: flex; justify-content: center; gap: 20px; margin: 40px auto; flex-wrap: wrap; }
        .toggle-btn { padding: 15px 35px; background: transparent; border: 2px solid var(--accent); color: var(--accent); font-family: 'Oswald', sans-serif; font-size: 1.2rem; text-transform: uppercase; letter-spacing: 2px; cursor: pointer; border-radius: 50px; transition: 0.3s; }
        .toggle-btn:hover { background: var(--accent); color: black; }

        /* COLLAPSIBLE SECTIONS */
        .expand-section { max-height: 0; overflow: hidden; transition: max-height 0.8s ease-out; background: rgba(0,0,0,0.3); }
        .expand-section.open { max-height: 5000px; padding: 40px 0; }

        /* GAME SPECIFIC STYLING */
        .games-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        .game-card { background: #202020; border-radius: 15px; border: 1px solid #444; overflow: hidden; transition: 0.3s; }
        .game-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(255, 180, 0, 0.2); }
        .game-img { width: 100%; height: 200px; object-fit: contain; background: #000; padding: 10px; }
        .game-btn { display: block; background: var(--accent); color: #1a1a1a; padding: 12px; text-align: center; text-decoration: none; font-family: 'Bebas Neue', sans-serif; font-size: 1.4rem; }

        .archive-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 25px; max-width: 1200px; margin: 0 auto; padding: 20px; }
        .archive-card { background: #1a1a1a; border-radius: 15px; border: 1px solid #333; text-align: center; overflow: hidden; }
        .archive-art { width: 100%; height: 220px; background-size: contain; background-repeat: no-repeat; background-position: center; background-color: #080808; }
    </style>
</head>
<body>

    <div class="header-container">
        <img src="https://github.com/lawbrewing/LawBrewing/blob/main/LBC%20-%20Black%20Transparent%20(1).png?raw=true" alt="Law Brewing Logo" class="backlit-logo">
        <div class="sub-brand">Liquid Attitude Taps</div>
    </div>

    <div class="tap-container" id="tap-display"></div>

    <div class="button-center">
        <button class="toggle-btn" onclick="toggleSection('game-wrapper', this)">Bar Games</button>
        <button class="toggle-btn" onclick="toggleSection('archive-wrapper', this)">View The Cellar</button>
    </div>

    <div id="game-wrapper" class="expand-section">
        <h2 style="text-align:center; font-family:'Bebas Neue'; color:var(--accent); font-size:3rem; letter-spacing:5px;">BAR GAMES</h2>
        <div class="games-grid">
            <div class="game-card">
                <img src="https://github.com/lawbrewing/LawBrewing/blob/main/Gemini_Generated_Image_f46i9af46i9af46i.png?raw=true" class="game-img">
                <div style="padding:20px; text-align:center;">
                    <h3 style="font-family:'Roboto Slab'; font-size:1.2rem;">Sheriff of Taps</h3>
                    <a href="defender.html" class="game-btn">Play Defender</a>
                </div>
            </div>
            <div class="game-card">
                <img src="1766341219164~2.jpg" class="game-img">
                <div style="padding:20px; text-align:center;">
                    <h3 style="font-family:'Roboto Slab'; font-size:1.2rem;">Beer Flight Card Game</h3>
                    <a href="Thetaproom.html" class="game-btn">Play Taproom</a>
                </div>
            </div>
            <div class="game-card">
                <img src="https://github.com/lawbrewing/LawBrewing/blob/main/bardice%20(2).png?raw=true" class="game-img">
                <div style="padding:20px; text-align:center;">
                    <h3 style="font-family:'Roboto Slab'; font-size:1.2rem;">Law Brewing: Bar Dice</h3>
                    <a href="bardice.html" class="game-btn">Play Bar Dice</a>
                </div>
            </div>
            <div class="game-card">
                <img src="https://github.com/lawbrewing/LawBrewing/blob/main/ttt.png?raw=true" class="game-img">
                <div style="padding:20px; text-align:center;">
                    <h3 style="font-family:'Roboto Slab'; font-size:1.2rem;">Tactical Tic Tac Toe</h3>
                    <a href="tictactoe.html" class="game-btn">Play Tic Tac Toe</a>
                </div>
            </div>
            <div class="game-card">
                <img src="https://github.com/lawbrewing/LawBrewing/blob/main/taproomchaos.png?raw=true" class="game-img">
                <div style="padding:20px; text-align:center;">
                    <h3 style="font-family:'Roboto Slab'; font-size:1.2rem;">Taproom Chaos</h3>
                    <a href="taproomchaosgame.html" class="game-btn">Play Chaos</a>
                </div>
            </div>
        </div>
    </div>

    <div id="archive-wrapper" class="expand-section">
        <h2 style="text-align:center; font-family:'Oswald'; color:var(--accent); letter-spacing:4px;">PAST BREWS</h2>
        <div class="archive-grid" id="archive-display"></div>
    </div>

    <script>
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQWqyJ5-pMWhRUkkZLoHdmFPtOHJozHRJkL9c0ivSSY9J7Fp0lto4W05tH-XbFelBL-htJZXedhv7i3/pub?output=csv';
        
        function toggleSection(id, btn) {
            const el = document.getElementById(id);
            const isOpen = el.classList.contains('open');
            // Close all first
            document.querySelectorAll('.expand-section').forEach(s => s.classList.remove('open'));
            if (!isOpen) el.classList.add('open');
        }

        async function updateDisplay() {
            try {
                const cacheBuster = new Date().getTime();
                const [wRes, sRes] = await Promise.all([
                    fetch('tap_weights.json?t=' + cacheBuster),
                    fetch(CSV_URL + '&t=' + cacheBuster)
                ]);
                const weights = await wRes.json();
                const csvData = (await sRes.text()).split('\n').map(row => row.split(','));
                
                const tapContainer = document.getElementById('tap-display');
                const archiveContainer = document.getElementById('archive-display');
                tapContainer.innerHTML = ''; archiveContainer.innerHTML = '';

                for (let i = 1; i < csvData.length; i++) {
                    const row = csvData[i]; if (!row[2]) continue;
                    const tapID=row[0], bName=row[2], bABV=row[3], bImage=row[4], bDesc=row[5], bStyle=row[6];

                    if (tapID && tapID.trim() !== "") {
                        const pct = weights[tapID] || 0;
                        const tapTime = weights[tapID + "_updated"] || "--:--";
                        tapContainer.innerHTML += `
                            <div class="beer-card">
                                <div class="label-art" style="background-image: url('${bImage}');"></div>
                                <div class="details">
                                    <div class="tap-id-tag">${tapID}</div>
                                    <h2 class="beer-name">${bName}</h2>
                                    <div class="stats"><span>${bStyle}</span><span>ABV: ${bABV}</span></div>
                                    <p class="description">${bDesc}</p>
                                    <div class="volume-container">
                                        <div class="volume-bar" style="width:${pct}%"></div>
                                        <div class="volume-text">${Math.round((pct/100)*41)} PINTS LEFT</div>
                                    </div>
                                    <div class="tap-timestamp">Sync: ${tapTime}</div>
                                </div>
                            </div>`;
                    } else {
                        archiveContainer.innerHTML += `
                            <div class="archive-card">
                                <div class="archive-art" style="background-image: url('${bImage}');"></div>
                                <div class="archive-name">${bName}</div>
                                <div class="archive-stats">${bStyle} | ABV: ${bABV}</div>
                            </div>`;
                    }
                }
            } catch (err) { console.log(err); }
        }
        updateDisplay();
        setInterval(updateDisplay, 30000);
    </script>
</body>
</html>
