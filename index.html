<!DOCTYPE html>
<html>
<head>
    <title>Law Brewing Taproom</title>
    <style>
        body { background: #121212; color: #e0e0e0; font-family: 'Helvetica Neue', sans-serif; margin: 0; padding: 40px; }
        h1 { text-align: center; color: #d4a017; letter-spacing: 4px; font-size: 3em; margin-bottom: 50px; text-transform: uppercase; }
        .tap-grid { display: flex; justify-content: center; gap: 30px; flex-wrap: wrap; }
        .card { background: #1e1e1e; border: 1px solid #333; border-radius: 12px; width: 320px; padding: 25px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .tap-id { color: #d4a017; font-weight: bold; font-size: 0.9em; margin-bottom: 15px; display: block; }
        .art { width: 100%; height: 200px; object-fit: cover; border-radius: 8px; margin-bottom: 20px; border: 1px solid #444; }
        h2 { margin: 10px 0; font-size: 1.8em; color: #fff; }
        .abv { background: #d4a017; color: #000; display: inline-block; padding: 2px 10px; border-radius: 4px; font-weight: bold; margin-bottom: 15px; }
        .desc { font-size: 0.95em; color: #aaa; line-height: 1.5; height: 70px; overflow: hidden; }
        .gauge-bg { background: #333; height: 12px; border-radius: 6px; margin-top: 25px; position: relative; }
        .gauge-fill { background: linear-gradient(90deg, #d4a017, #f4d03f); height: 100%; border-radius: 6px; transition: 1s; }
        .percent { display: block; margin-top: 8px; font-size: 0.8em; color: #d4a017; font-weight: bold; }
    </style>
</head>
<body>
    <h1>LAW BREWING CO.</h1>
    <div class="tap-grid" id="display"></div>

    <script>
        async function load() {
            const r = await fetch('taps.json?t=' + Date.now());
            const d = await r.json();
            const grid = document.getElementById('display');
            grid.innerHTML = '';

            Object.entries(d.active_taps).forEach(([tap, beer]) => {
                const b = d.library[beer] || { abv: '0%', desc: '', artwork: 'logo.png', percent: 0 };
                grid.innerHTML += `
                    <div class="card">
                        <span class="tap-id">${tap}</span>
                        <img src="images/labels/${b.artwork}" class="art">
                        <h2>${beer}</h2>
                        <div class="abv">${b.abv}</div>
                        <p class="desc">${b.desc}</p>
                        <div class="gauge-bg">
                            <div class="gauge-fill" style="width: ${b.percent}%"></div>
                        </div>
                        <span class="percent">${b.percent}% REMAINING</span>
                    </div>`;
            });
        }
        load();
        setInterval(load, 30000);
    </script>
</body>
</html>
