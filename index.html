<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Law Brewing - Live Taps</title>
    <style>
        :root {
            --gold: #f1c40f;
            --glow: rgba(241, 196, 15, 0.6);
            --dark-bg: #0a0a0a;
            --card-bg: #161616;
        }

        body {
            background-color: var(--dark-bg);
            color: white;
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0; padding: 0; text-align: center;
        }

        header { padding: 50px 20px; background: radial-gradient(circle, #1a1a1a 0%, #0a0a0a 100%); }
        .glowing-logo {
            color: var(--gold);
            font-size: 3.5rem;
            letter-spacing: 10px;
            text-transform: uppercase;
            text-shadow: 0 0 15px var(--glow), 0 0 30px var(--glow);
            margin: 0; font-weight: 900;
        }

        .tap-container {
            max-width: 1100px;
            margin: 30px auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            padding: 20px;
        }

        .tap-card { background: var(--card-bg); border-radius: 20px; padding: 25px; border: 1px solid #222; position: relative; }
        .tap-label { position: absolute; top: 15px; right: 20px; color: var(--gold); font-size: 0.8rem; font-weight: bold; }
        .beer-art { width: 180px; height: 180px; border-radius: 50%; border: 3px solid var(--gold); margin: 15px 0; object-fit: cover; }
        .beer-name { font-size: 1.8rem; font-weight: bold; margin: 5px 0; }
        
        /* Stats Section */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .stat-item { background: #222; padding: 10px; border-radius: 10px; }
        .stat-val { display: block; font-size: 1.3rem; font-weight: bold; color: var(--gold); }
        .stat-lbl { font-size: 0.7rem; color: #666; text-transform: uppercase; }

        /* Progress Bar */
        .bar-outer { background: #111; height: 35px; border-radius: 20px; border: 1px solid #333; overflow: hidden; position: relative; }
        .bar-inner { background: linear-gradient(90deg, #b8860b, var(--gold)); height: 100%; transition: width 1s ease-in-out; }
        .bar-text { position: absolute; width: 100%; top: 0; left: 0; line-height: 35px; font-weight: bold; text-shadow: 1px 1px 2px black; }
    </style>
</head>
<body>

    <header>
        <h1 class="glowing-logo">LAW BREWING</h1>
    </header>

    <div id="tap-grid" class="tap-container"></div>

    <script>
        async function updateDashboard() {
            try {
                // Fetch the weights file pushed by raw_brain.py
                const weightRes = await fetch('tap_weights.json?t=' + Date.now());
                const weights = await weightRes.json();
                
                const libRes = await fetch('library.json');
                const library = await libRes.json();
                
                const grid = document.getElementById('tap-grid');
                grid.innerHTML = '';

                // Linking the Raw Brain names to the Library IDs
                const taps = [
                    { label: "LAW TAP",   id: "5657071", current: weights["Law Tap"] },
                    { label: "WISCO TAP", id: "none",    current: weights["Wisco Tap"] },
                    { label: "NITRO TAP", id: "none",    current: weights["Nitro Tap"] }
                ];

                taps.forEach(tap => {
                    const beer = library[tap.id];
                    if (beer) {
                        const pints = (40 * (tap.current / 100)).toFixed(1);
                        const growlers = (pints / 4).toFixed(1);

                        grid.innerHTML += `
                            <div class="tap-card">
                                <div class="tap-label">${tap.label}</div>
                                <img src="static/images/library/${tap.id}.jpeg" class="beer-art">
                                <div class="beer-name">${beer.name}</div>
                                <div class="stats-grid">
                                    <div class="stat-item"><span class="stat-val">${pints}</span><span class="stat-lbl">Pints</span></div>
                                    <div class="stat-item"><span class="stat-val">${growlers}</span><span class="stat-lbl">Growlers</span></div>
                                </div>
                                <div class="bar-outer">
                                    <div class="bar-inner" style="width: ${tap.current}%"></div>
                                    <div class="bar-text">${tap.current}% FULL</div>
                                </div>
                            </div>`;
                    }
                });
            } catch (e) { console.log("Syncing weights..."); }
        }

        setInterval(updateDashboard, 30000);
        updateDashboard();
    </script>
</body>
</html>
