<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Law Brewing | Live Taproom</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Roboto:wght@300;400&family=Bebas+Neue&family=Roboto+Slab:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #ffb400; --bg: #121212; --card: #1e1e1e; --text: #ffffff; }
        body { background: var(--bg); color: var(--text); font-family: 'Roboto', sans-serif; margin: 0; padding-bottom: 80px; }
        .header-container { text-align: center; padding: 50px 0 30px; background: radial-gradient(circle, #2a2a2a 0%, #121212 80%); border-bottom: 2px solid var(--accent); }
        .backlit-logo { max-width: 280px; filter: drop-shadow(0 0 10px rgba(255,180,0,0.5)); }
        .sub-brand { font-family: 'Oswald', sans-serif; color: var(--accent); text-transform: uppercase; letter-spacing: 6px; margin-top: 15px; font-size: 1.5rem; }
        
        .tap-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 30px; max-width: 1300px; margin: 40px auto; padding: 20px; align-items: stretch; }
        .beer-card { background: var(--card); border-radius: 20px; border: 1px solid #333; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); height: 100%; position: relative; }
        
        .top-rated-ribbon { 
            position: absolute; top: 15px; right: -35px; background: var(--accent); color: #000; 
            padding: 5px 40px; transform: rotate(45deg); font-family: 'Oswald'; font-weight: bold; 
            font-size: 0.8rem; letter-spacing: 1px; z-index: 10; box-shadow: 0 0 20px rgba(255,180,0,0.6); 
            text-transform: uppercase; animation: pulse-glow 2s infinite ease-in-out;
            display: flex; align-items: center; justify-content: center; height: 25px;
        }
        @keyframes pulse-glow { 0% { box-shadow: 0 0 10px rgba(255,180,0,0.4); } 50% { box-shadow: 0 0 25px rgba(255,180,0,0.8); } 100% { box-shadow: 0 0 10px rgba(255,180,0,0.4); } }

        .label-art { width: 100%; height: 350px; background-size: contain; background-repeat: no-repeat; background-position: center; background-color: #000; border-bottom: 3px solid var(--accent); }
        .details { padding: 25px; flex-grow: 1; display: flex; flex-direction: column; }
        .beer-name-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 5px; }
        .beer-name { font-family: 'Oswald', sans-serif; font-size: 2.1rem; margin: 0; text-transform: uppercase; line-height: 1.1; }
        .avg-badge { background: rgba(255,180,0,0.15); color: var(--accent); padding: 4px 10px; border-radius: 8px; font-size: 1.1rem; border: 1px solid rgba(255,180,0,0.4); font-family: 'Oswald'; font-weight: bold; white-space: nowrap; }

        .stats { font-family: 'Oswald', sans-serif; color: var(--accent); font-size: 1.1rem; margin: 10px 0; display: flex; justify-content: space-between; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .description { font-size: 0.95rem; color: #ccc; line-height: 1.5; margin-bottom: 20px; flex-grow: 1; white-space: pre-wrap; }
        
        /* --- STABLE HALF STAR SYSTEM --- */
        .rating-box { background: rgba(255,255,255,0.03); padding: 5px; border-radius: 12px; margin-bottom: 20px; text-align: center; border: 1px solid #333; min-height: 60px; display: flex; align-items: center; justify-content: center; flex-direction: column; }
        
        .rating-container { display: flex; flex-direction: row-reverse; justify-content: center; }
        .rating-container input { display: none; }
        
        /* The Slices */
        .rating-container label {
            width: 15px; /* Exact pixel width */
            height: 30px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            color: #555; /* Empty Color */
        }
        
        /* The Star Character (Locked via Arial) */
        .rating-container label::before {
            content: '★';
            position: absolute;
            font-size: 30px;
            line-height: 30px;
            top: 0;
            font-family: Arial, sans-serif; /* Prevents font distortion */
        }
        
        /* Left Half Slices */
        .rating-container label.half-left::before {
            left: 0;
        }
        
        /* Right Half Slices (Shift star left to reveal right side) */
        .rating-container label.half-right::before {
            left: -15px; 
        }

        /* Hover & Checked States */
        .rating-container input:checked ~ label,
        .rating-container label:hover,
        .rating-container label:hover ~ label {
            color: var(--accent);
            text-shadow: 0 0 10px rgba(255,180,0,0.6);
        }
        
        .thanks-msg { display: none; font-family: 'Oswald'; color: var(--accent); font-size: 1.3rem; font-weight: bold; letter-spacing: 1px; }

        .volume-container { background: #000; height: 32px; border-radius: 16px; position: relative; overflow: hidden; border: 2px solid #444; margin-top: auto; }
        .volume-bar { background: linear-gradient(90deg, #b8860b, var(--accent)); height: 100%; transition: width 1.5s ease; }
        .volume-text { position: absolute; width: 100%; text-align: center; top: 6px; font-weight: bold; font-size: 0.9rem; color: white; text-shadow: 1px 1px 3px black; }
        
        .tap-footer { 
            display: flex; justify-content: space-between; align-items: center; 
            margin-top: 15px; border-top: 1px solid #2a2a2a; padding-top: 10px; 
            font-size: 0.75rem; color: #777; font-weight: bold; letter-spacing: 1px;
        }
        .temp-display { font-family: 'Oswald'; font-size: 1.2rem; color: var(--accent); display: flex; align-items: center; gap: 5px; }
        .pour-display { color: #aaa; text-transform: uppercase; }
        .time-display { text-transform: uppercase; }

        /* MENU BUTTONS */
        .button-center { display: flex; justify-content: center; gap: 20px; margin: 40px auto; flex-wrap: wrap; }
        /* Reverted to original toggle-btn style for uniformity */
        .toggle-btn { padding: 12px 30px; background: transparent; border: 2px solid var(--accent); color: var(--accent); font-family: 'Oswald'; cursor: pointer; border-radius: 50px; text-transform: uppercase; letter-spacing: 1px; transition: 0.3s; text-decoration: none; display: inline-block; font-size: 0.85rem; }
        .toggle-btn:hover { background: var(--accent); color: #000; }

        /* EXPAND SECTIONS */
        .expand-section { max-height: 0; overflow: hidden; transition: max-height 0.8s ease-out; background: rgba(0,0,0,0.3); }
        .expand-section.open { max-height: 20000px; padding: 40px 0; }
        
        /* GRID LAYOUTS */
        .games-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; max-width: 1300px; margin: 0 auto; padding: 0 20px; }
        .game-card { background: #202020; border-radius: 15px; border: 1px solid #444; overflow: hidden; display: flex; flex-direction: column; }

        /* AWARD MEDAL STYLES */
        .medal-icon { display: inline-block; cursor: pointer; margin-left: 6px; transition: transform 0.2s; vertical-align: middle; }
        .medal-icon:hover { transform: scale(1.2); }
        .medal-grand-champion { font-size: 1.8em; filter: drop-shadow(0 0 10px rgba(185, 242, 255, 0.9)); animation: pulse-prism 2.5s infinite alternate; }
        .medal-national { font-size: 1.6em; filter: drop-shadow(0 0 8px rgba(255, 215, 0, 0.8)); animation: pulse-gold 2s infinite; }
        .medal-state { font-size: 1.3em; filter: drop-shadow(0 0 2px rgba(255, 255, 255, 0.5)); }
        .medal-local { font-size: 1.0em; opacity: 0.9; }

        #award-wrapper .medal-grand-champion,
        #award-wrapper .medal-national { animation: none !important; }

        @keyframes pulse-gold { 0% { transform: scale(1); filter: drop-shadow(0 0 5px gold); } 50% { transform: scale(1.1); filter: drop-shadow(0 0 15px gold); } 100% { transform: scale(1); filter: drop-shadow(0 0 5px gold); } }
        @keyframes pulse-prism { 0% { filter: drop-shadow(0 0 5px rgba(255,215,0,0.8)); transform: scale(1); } 50% { filter: drop-shadow(0 0 15px rgba(255,255,255,1)); transform: scale(1.15); } 100% { filter: drop-shadow(0 0 5px rgba(255,215,0,0.8)); transform: scale(1); } }

        /* AWARD CASE STYLES */
        #award-wrapper { text-align: center; }
        .award-container { max-width: 900px; margin: 0 auto; padding: 20px; text-align: left; }
        .award-group { margin-bottom: 25px; border-left: 4px solid #4caf50; padding-left: 20px; background: rgba(255, 255, 255, 0.05); padding: 15px; border-radius: 0 8px 8px 0; }
        .award-group h3 { margin: 0 0 10px 0; color: #ffc107; font-family: serif; letter-spacing: 1px; font-size: 1.5rem; border-bottom: 1px solid #444; padding-bottom: 5px; text-transform: uppercase; }
        .award-row { display: flex; justify-content: space-between; padding: 10px 0; font-size: 1.1em; border-bottom: 1px solid #333; }
        .award-row:last-child { border-bottom: none; }
        .award-year { color: #888; font-weight: bold; margin-right: 15px; font-family: 'Oswald'; }
        .award-beer { color: #fff; font-weight: bold; }
        .award-detail { color: #aaa; font-style: italic; margin-right: 5px; }

        /* QR SECTION RESTORED */
        .qr-section { text-align: center; margin: 60px 0 30px; }
        .qr-code { width: 150px; height: 150px; filter: drop-shadow(0 0 10px var(--accent)); }
        .qr-text { font-family: 'Oswald'; color: var(--accent); letter-spacing: 2px; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="header-container">
        <img src="https://github.com/lawbrewing/LawBrewing/blob/main/LBC%20-%20Black%20Transparent%20(1).png?raw=true" alt="Law Brewing" class="backlit-logo">

            <div class="game-card"><img src="1766341219164~2.jpg" style="height:200px; object-fit:contain; background:#000; padding:10px;"><div style="padding:20px; text-align:center;"><h3 style="color:white; font-family:'Roboto Slab'; font-size:1.2rem;">Beer Flight Card Game</h3><a href="Thetaproom.html" style="display:block; background:var(--accent); color:#1a1a1a; padding:12px; text-align:center; text-decoration:none; font-family:'Bebas Neue'; font-size:1.4rem;">Play Taproom</a></div></div>

            <div class="game-card"><img src="https://github.com/lawbrewing/LawBrewing/blob/main/taproomchaos.png?raw=true" style="height:200px; object-fit:contain; background:#000; padding:10px;"><div style="padding:20px; text-align:center;"><h3 style="color:white; font-family:'Roboto Slab'; font-size:1.2rem;">Taproom Chaos</h3><a href="taproomchaosgame.html" style="display:block; background:var(--accent); color:#1a1a1a; padding:12px; text-align:center; text-decoration:none; font-family:'Bebas Neue'; font-size:1.4rem;">Play Chaos</a></div></div>

        <p class="qr-text">SCAN TO JOIN THE TAPROOM</p>
    </div>

    <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>
    <form id="rating_form" action="https://docs.google.com/forms/d/e/1FAIpQLSfx4apNIy6wi1CrFW-B8u01vJ_2ci1fcStPSWcWLFK9DpRs8g/formResponse" method="POST" target="hidden_iframe" style="display:none;">
        <input type="hidden" name="entry.1650190471" id="form_beer">
        <input type="hidden" name="entry.958548151" id="form_score">
    </form>

    <script>
        const MAIN_CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQWqyJ5-pMWhRUkkZLoHdmFPtOHJozHRJkL9c0ivSSY9J7Fp0lto4W05tH-XbFelBL-htJZXedhv7i3/pub?output=csv';
        const SCOREBOARD_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRHD6zTvSE5HfErbLPAHhb0NyXDLuvt_cpOEQxr76BFNpN-KgbL3y68LIogt1aEhVAxIP4JU9t1Kte1/pub?gid=1912157964&single=true&output=csv";
        let globalBeerData = [];

        function parseCSV(data) {
            const result = []; let row = []; let col = ''; let inQuotes = false;
            for (let i = 0; i < data.length; i++) {
                let char = data[i], next = data[i+1];
                if (char === '"' && inQuotes && next === '"') { col += '"'; i++; }
                else if (char === '"') { inQuotes = !inQuotes; }
                else if (char === ',' && !inQuotes) { row.push(col); col = ''; }
                else if (char === '\n' && !inQuotes) { row.push(col); result.push(row); row = []; col = ''; }
                else { col += char; }
            }
            if (col || row.length) { row.push(col); result.push(row); }
            return result;
        }

        function submitRating(beerName, score, cardId) {
            if (localStorage.getItem('voted_' + beerName)) {
                alert("Cheers! You've already rated this brew.");
                return;
            }
            document.getElementById('form_beer').value = beerName;
            document.getElementById('form_score').value = score;
            document.getElementById('rating_form').submit();
            
            localStorage.setItem('voted_' + beerName, 'true');
            const box = document.getElementById(`box-${cardId}`);
            if (box) box.innerHTML = '<div class="thanks-msg" style="display:block">CHEERS! 🍻</div>';
        }

        function getMedalClass(compName, medalName) {
            const c = compName.toLowerCase();
            const m = medalName.toLowerCase();
            if (c.includes('best of show') || m.includes('best of show') || m.includes('grand champion')) return 'medal-grand-champion';
            if (c.includes('national') || c.includes('nhc')) return 'medal-national'; 
            if (c.includes('state') || c.includes('wisconsin')) return 'medal-state'; 
            return 'medal-local';
        }

        function getMedalIcon(compName, medalName) {
            const m = medalName.toLowerCase();
            const c = compName.toLowerCase();
            if (c.includes('best of show')) return '🏆';
            if (m.includes('best of show') || m.includes('grand')) return '🏆';
            if (m.includes('gold')) return '🥇';
            if (m.includes('silver')) return '🥈';
            if (m.includes('bronze')) return '🥉';
            return 'Ribbon'; 
        }

        function cleanMedalText(medalName) {
            const m = medalName.toLowerCase();
            if (m === 'gold' || m === 'silver' || m === 'bronze') return '';
            return medalName;
        }

        function renderCardMedals(awardString) {
            if (!awardString) return '';
            const awards = awardString.split(',').map(s => {
                const p = s.split('|');
                if(p.length < 3) return null;
                return { comp: p[0].trim(), medal: p[1].trim(), year: p[2].trim() };
            }).filter(a => a);

            let html = '';
            awards.forEach(a => {
                const cssClass = getMedalClass(a.comp, a.medal);
                const icon = getMedalIcon(a.comp, a.medal);
                html += `<span class="${cssClass} medal-icon" onclick="goToAwards()" title="${a.year} ${a.comp} (${a.medal})">${icon}</span>`;
            });
            return html;
        }

        function renderTrophyCase() {
            const content = document.getElementById('award-content');
            let html = '';
            let groups = {};
            
            globalBeerData.forEach(row => {
                const awardStr = row[7] || ""; 
                const bName = row[2] || "Unknown";
                if (!awardStr) return;

                const awards = awardStr.split(',').map(s => {
                    const p = s.split('|');
                    if(p.length < 3) return null;
                    return { comp: p[0].trim(), medal: p[1].trim(), year: p[2].trim() };
                }).filter(a => a);

                awards.forEach(a => {
                    if (!groups[a.comp]) groups[a.comp] = [];
                    groups[a.comp].push({ beer: bName, ...a });
                });
            });

            const sortedKeys = Object.keys(groups).sort((a, b) => {
                const getScore = (name) => {
                    const n = name.toLowerCase();
                    if (n.includes('best of show')) return 4;
                    if (n.includes('national')) return 3;
                    if (n.includes('state')) return 2;
                    return 1;
                };
                return getScore(b) - getScore(a);
            });

            if (sortedKeys.length === 0) {
                content.innerHTML = "<p style='text-align:center; color:#666;'>No awards discovered... yet.</p>";
                return;
            }

            sortedKeys.forEach(comp => {
                html += `<div class="award-group"><h3>${comp}</h3>`;
                groups[comp].sort((a,b) => b.year - a.year);
                groups[comp].forEach(win => {
                    const cssClass = getMedalClass(win.comp, win.medal);
                    const icon = getMedalIcon(win.comp, win.medal);
                    const cleanedMedal = cleanMedalText(win.medal);
                    
                    html += `<div class="award-row">
                        <span><span class="award-year">${win.year}</span> <span class="award-beer">${win.beer}</span></span>
                        <span class="${cssClass}"><span class="award-detail">${cleanedMedal}</span> ${icon}</span>
                    </div>`;
                });
                html += `</div>`;
            });

            content.innerHTML = html;
        }

        function toggleSection(id) {
            const el = document.getElementById(id);
            document.querySelectorAll('.expand-section').forEach(s => { if(s.id !== id) s.classList.remove('open'); });
            el.classList.toggle('open');
        }

        function goToAwards() {
            const el = document.getElementById('award-wrapper');
            document.querySelectorAll('.expand-section').forEach(s => { if(s.id !== 'award-wrapper') s.classList.remove('open'); });
            el.classList.add('open');
            setTimeout(() => {
                el.scrollIntoView({ behavior: 'smooth' });
            }, 300);
        }

        async function updateDisplay() {
            try {
                const cb = new Date().getTime();
                const [wRes, mRes] = await Promise.all([
                    fetch('tap_weights.json?t=' + cb),
                    fetch(MAIN_CSV + '&t=' + cb)
                ]);
                const weights = await wRes.json();
                const beerData = parseCSV(await mRes.text());
                globalBeerData = beerData;
                renderTrophyCase();

                let ratingMap = {}; let ratingsArray = [];
                try {
                    const rRes = await fetch(SCOREBOARD_URL + '&t=' + cb);
                    const ratingText = await rRes.text();
                    if (ratingText && !ratingText.includes("DOCTYPE")) {
                        parseCSV(ratingText).forEach(r => {
                            if(r[0] && r[1]) {
                                const s = parseFloat(r[1]);
                                ratingMap[r[0].trim()] = s.toFixed(1);
                                if (s > 0) ratingsArray.push({ name: r[0].trim(), score: s });
                            }
                        });
                    }
                } catch(e) {}

                ratingsArray.sort((a, b) => b.score - a.score);
                const top3Names = ratingsArray.slice(0, 3).map(r => r.name);

                const tapContainer = document.getElementById('tap-display');
                const archiveContainer = document.getElementById('archive-display');
                tapContainer.innerHTML = ''; archiveContainer.innerHTML = '';

                beerData.forEach((row, i) => {
                    if (i === 0 || row.length < 3) return;
                    const tapID = (row[0] || "").trim();
                    const bName = (row[2] || "").trim();
                    const awardsStr = row[7] || ""; 
                    if (!bName) return;

                    const escapedName = bName.replace(/'/g, "\\'");
                    const isTop = top3Names.includes(bName);
                    const topRibbon = isTop ? `<div class="top-rated-ribbon">Top Rated</div>` : '';
                    const avg = ratingMap[bName] ? `<span class="avg-badge">⭐ ${ratingMap[bName]}</span>` : '';
                    const hasVoted = localStorage.getItem('voted_' + bName);
                    const medalHTML = renderCardMedals(awardsStr);
                    
                    const ratingHTML = `
                        <div class="rating-box" id="box-${i}">
                            ${hasVoted ? 
                                '<div class="thanks-msg" style="display:block">CHEERS! 🍻</div>' : 
                                `<div class="rating-container">
                                    <input type="radio" id="st10-${i}" onclick="submitRating('${escapedName}', 5, ${i})"><label for="st10-${i}" class="half-right" title="5"></label>
                                    <input type="radio" id="st9-${i}" onclick="submitRating('${escapedName}', 4.5, ${i})"><label for="st9-${i}" class="half-left" title="4.5"></label>
                                    <input type="radio" id="st8-${i}" onclick="submitRating('${escapedName}', 4, ${i})"><label for="st8-${i}" class="half-right" title="4"></label>
                                    <input type="radio" id="st7-${i}" onclick="submitRating('${escapedName}', 3.5, ${i})"><label for="st7-${i}" class="half-left" title="3.5"></label>
                                    <input type="radio" id="st6-${i}" onclick="submitRating('${escapedName}', 3, ${i})"><label for="st6-${i}" class="half-right" title="3"></label>
                                    <input type="radio" id="st5-${i}" onclick="submitRating('${escapedName}', 2.5, ${i})"><label for="st5-${i}" class="half-left" title="2.5"></label>
                                    <input type="radio" id="st4-${i}" onclick="submitRating('${escapedName}', 2, ${i})"><label for="st4-${i}" class="half-right" title="2"></label>
                                    <input type="radio" id="st3-${i}" onclick="submitRating('${escapedName}', 1.5, ${i})"><label for="st3-${i}" class="half-left" title="1.5"></label>
                                    <input type="radio" id="st2-${i}" onclick="submitRating('${escapedName}', 1, ${i})"><label for="st2-${i}" class="half-right" title="1"></label>
                                    <input type="radio" id="st1-${i}" onclick="submitRating('${escapedName}', 0.5, ${i})"><label for="st1-${i}" class="half-left" title="0.5"></label>
                                </div>`
                            }
                        </div>`;

                    const cardHTML = `
                        <div class="beer-card">
                            ${topRibbon}
                            <div class="label-art" style="background-image: url('${row[4]}'); ${tapID.toLowerCase().includes("tap") ? '' : 'height:250px;'}"></div>
                            <div class="details">
                                ${tapID.toLowerCase().includes("tap") ? `<div style="font-size:0.8rem; color:#888; letter-spacing:2px; margin-bottom:5px;">${tapID}</div>` : ''}
                                <div class="beer-name-row">
                                    <h2 class="beer-name" ${tapID.toLowerCase().includes("tap") ? '' : 'style="font-size:1.5rem;"'}>${bName} ${medalHTML}</h2>
                                    ${avg}
                                </div>
                                <div class="stats"><span>${row[6]}</span><span>ABV: ${row[3]}</span></div>
                                ${tapID.toLowerCase().includes("tap") ? `<p class="description">${row[5]}</p>` : ''}
                                ${ratingHTML}
                                ${tapID.toLowerCase().includes("tap") ? `
                                    <div class="volume-container">
                                        <div class="volume-bar" style="width:${weights[tapID]||0}%"></div>
                                        <div class="volume-text">${Math.round(((weights[tapID]||0)/100)*41)} PINTS LEFT</div>
                                    </div>
                                    <div class="tap-footer">
                                        <div class="temp-display">${weights[tapID+"_temp"] ? `<span style="font-size:1.2rem;">🌡️</span> `+weights[tapID+"_temp"]+`°F` : ''}</div>
                                        <div class="pour-display">${weights[tapID+"_last_pour"] ? `LAST POUR: <span style="color:#fff">`+weights[tapID+"_last_pour"]+`</span>` : ''}</div>
                                        <div class="time-display">${weights[tapID+"_updated"] || "Waiting..."}</div>
                                    </div>` : ''}
                            </div>
                        </div>`;
                    
                    if (tapID.toLowerCase().includes("tap")) tapContainer.innerHTML += cardHTML;
                    else archiveContainer.innerHTML += cardHTML;
                });
            } catch (e) { console.error(e); }
        }
        
        updateDisplay();
        setInterval(updateDisplay, 30000);
    </script>
</body>
</html>
