<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Law Brewing - Live Taps</title>
    <style>
        :root { --gold: #f1c40f; --dark: #0a0a0a; --card: #1a1a1a; }
        body { background: var(--dark); color: white; font-family: 'Courier New', Courier, monospace; margin: 0; padding-bottom: 50px; }
        
        header { padding: 40px; border-bottom: 3px solid var(--gold); margin-bottom: 30px; background: #000; text-align: center; }
        .glowing-logo { color: var(--gold); font-size: 3.5rem; letter-spacing: 12px; text-shadow: 0 0 20px rgba(241, 196, 15, 0.4); margin: 0; }

        .main-container { max-width: 1100px; margin: auto; padding: 20px; }
        
        /* Grid for multiple taps */
        .tap-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(450px, 1fr)); gap: 40px; }

        .tap-card { 
            background: var(--card); border-radius: 20px; padding: 25px; 
            border: 1px solid #333; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex; flex-direction: column;
        }

        /* Fixed Art Cropping */
        .beer-art { 
            width: 100%; height: auto; max-height: 400px; border-radius: 10px; 
            object-fit: contain; /* Changed from cover to contain to stop cropping */
            background: #000; margin-bottom: 20px; border: 1px solid #222; 
        }

        .tap-id-label { color: var(--gold); font-weight: bold; font-size: 1.1rem; letter-spacing: 4px; margin-bottom: 5px; opacity: 0.8; text-transform: uppercase; }
        .beer-name { font-size: 2.2rem; margin: 5px 0; color: #fff; text-transform: uppercase; line-height: 1.1; }
        .beer-meta { font-size: 1.2rem; color: #aaa; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid #333; }

        /* Progress Bar */
        .bar-container { height: 50px; background: #000; border-radius: 25px; position: relative; overflow: hidden; border: 2px solid #444; margin: 15px 0; }
        .bar-fill { height: 100%; background: linear-gradient(90deg, #8a6d3b, var(--gold)); transition: width 1.5s ease-in-out; }
        .bar-text { position: absolute; width: 100%; text-align: center; top: 12px; font-weight: bold; font-size: 1.2rem; color: white; text-shadow: 2px 2px 4px black; }

        .description { 
            text-align: left; line-height: 1.6; font-size: 1rem; background: rgba(0,0,0,0.3); 
            padding: 20px; border-radius: 10px; border-left: 4px solid var(--gold); white-space: pre-wrap;
            flex-grow: 1; /* Pushes the badge to the bottom */
        }

        .pints-badge { font-size: 1.2rem; color: var(--gold); margin-top: 15px; font-weight: bold; text-align: center; }
    </style>
</head>
<body>

    <header>
        <h1 class="glowing-logo">LAW BREWING</h1>
    </header>

    <div class="main-container">
        <div class="tap-grid" id="tap-display">
            <p>Scanning the taps...</p>
        </div>
    </div>

<script>
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQWqyJ5-pMWhRUkkZLoHdmFPtOHJozHRJkL9c0ivSSY9J7Fp0lto4W05tH-XbFelBL-htJZXedhv7i3/pub?output=csv';

        function parseCSV(str) {
            const arr = [];
            let quote = false, col = "", row = [];
            for (let c = 0; c < str.length; c++) {
                let char = str[c], next = str[c+1];
                if (char == '"' && quote && next == '"') { col += char; c++; continue; }
                if (char == '"') { quote = !quote; continue; }
                if (char == ',' && !quote) { row.push(col); col = ""; continue; }
                if (char == '\n' && !quote) { row.push(col); arr.push(row); col = ""; row = []; continue; }
                col += char;
            }
            row.push(col); arr.push(row);
            
            // CLEAN HEADERS: Removes invisible BOMs, spaces, and makes them lowercase
            const headers = arr[0].map(h => h.trim().toLowerCase().replace(/^\ufeff/g, "").replace(/\s/g, ""));
            
            return arr.slice(1).map(r => {
                return headers.reduce((obj, h, i) => {
                    obj[h] = r[i] ? r[i].trim() : '';
                    return obj;
                }, {});
            });
        }

        async function updateTaps() {
            try {
                const [wRes, sRes] = await Promise.all([
                    fetch('tap_weights.json?t=' + Date.now()),
                    fetch(CSV_URL + '&t=' + Date.now())
                ]);

                const weights = await wRes.json();
                const sheetText = await sRes.text();
                const beers = parseCSV(sheetText);

                const container = document.getElementById('tap-display');
                container.innerHTML = '';

                beers.forEach(beer => {
                    // Logic: Find the column regardless of how it's typed (tapid, beername, style, abv, imageurl, description)
                    const tapName = beer["tapid"];
                    if(!tapName || tapName === "") return; 

                    const pct = weights[tapName] || 0;
                    const pints = Math.round((pct / 100) * 40);

                    container.innerHTML += `
                        <div class="tap-card">
                            <div class="tap-id-label">${tapName}</div>
                            <img class="beer-art" src="${beer["imageurl"]}" onerror="this.src='https://via.placeholder.com/600x400?text=Beer+Label'">
                            <div class="beer-name">${beer["beername"]}</div>
                            <div class="beer-meta">${beer["style"]} • ${beer["abv"]}</div>
                            
                            <div class="bar-container">
                                <div class="bar-fill" style="width: ${pct}%"></div>
                                <div class="bar-text">${pct}% FULL</div>
                            </div>

                            <div class="description">${beer["description"]}</div>
                            <div class="pints-badge">${pints} PINTS LEFT</div>
                        </div>
                    `;
                });
            } catch (err) {
                console.error("Display update failed:", err);
            }
        }

        setInterval(updateTaps, 10000);
        updateTaps();
    </script>
</body>
</html>
