<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Incoming Transmission...</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            min-height: 100vh; /* Changed from fixed height to min-height */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            /* overflow: hidden;  <-- REMOVED THIS so you can scroll if needed */
        }

        /* Glitchy/Static Background vibe */
        body::before {
            content: '';
            position: fixed; /* Fixed so it doesn't scroll away */
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #1a1a1a 0%, #000 80%);
            z-index: -1;
        }

        .container {
            width: 90%;
            max-width: 700px;
            padding: 40px 20px; /* Added top/bottom padding to prevent cutting off */
            z-index: 10;
        }

        h1 {
            font-family: 'Oswald', sans-serif;
            font-size: 3.5rem;
            text-transform: uppercase;
            letter-spacing: 10px;
            margin: 0;
            color: #d4af37;
            text-shadow: 0 0 25px rgba(212, 175, 55, 0.5);
            margin-bottom: 10px;
            line-height: 1.1; /* Fix for line height cutting off text */
        }

        .tagline {
            font-size: 1rem;
            color: #888;
            letter-spacing: 6px;
            text-transform: uppercase;
            margin-bottom: 60px;
            font-weight: bold;
        }

        /* THE UNLOCK BUTTON */
        .unlock-btn {
            background: transparent;
            border: 2px solid #d4af37;
            color: #d4af37;
            padding: 20px 40px;
            font-size: 1.2rem;
            font-family: 'Oswald', sans-serif;
            text-transform: uppercase;
            letter-spacing: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.2);
            animation: pulse 2s infinite;
        }

        .unlock-btn:hover {
            background: #d4af37;
            color: #000;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.8);
        }

        /* HIDDEN CONTENT AREA */
        .hidden-content {
            display: none; 
            width: 100%;
            animation: flashIn 0.8s forwards;
            margin-top: 20px;
        }

        .video-frame {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            height: 0;
            border: 1px solid #444;
            box-shadow: 0 0 60px rgba(0,0,0,1);
        }

        .video-frame iframe {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
        }

        .footer-info {
            margin-top: 40px;
            font-size: 0.9rem;
            color: #666;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        /* ANIMATIONS */
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(212, 175, 55, 0); }
            100% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0); }
        }

        @keyframes flashIn {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* Responsive Type Fix */
        @media (max-width: 600px) {
            h1 { font-size: 2.2rem; letter-spacing: 4px; }
            .unlock-btn { padding: 15px 30px; font-size: 1rem; }
        }

    </style>
</head>
<body>

<div class="container">
    
    <div id="lock-screen">
        <h1>LAW BREWING</h1>
        <div class="tagline">Authorized Personnel Only</div>
        <button class="unlock-btn" onclick="unlockTeaser()">Initialize Session</button>
    </div>

    <div id="revealed-content" class="hidden-content">
        <h1 style="font-size: 2.5rem; letter-spacing: 5px; margin-top: 0;">LAW BREWING</h1>
        <div class="tagline" style="margin-bottom: 30px;">System Loading...</div>

        <div class="video-frame">
            <iframe id="video-player" src="https://www.youtube.com/embed/z5rRZdiu1UE?enablejsapi=1" title="Teaser" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>

        <div class="footer-info">
            <p>Four Tracks. Four Pours. One Night.</p>
            <p style="color: #d4af37;">Get Ready.</p>
        </div>
    </div>

</div>

<script>
    function unlockTeaser() {
        document.getElementById('lock-screen').style.display = 'none';
        
        // Reset body alignment to ensure top content is visible if it was centered weirdly
        document.body.style.justifyContent = 'flex-start';
        document.body.style.paddingTop = '20px'; // Add a little breathing room at the very top

        var content = document.getElementById('revealed-content');
        content.style.display = 'block';

        var iframe = document.getElementById('video-player');
        iframe.src += "&autoplay=1";
    }
</script>

</body>
</html>
