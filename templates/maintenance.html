<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance | Law Brewing</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Roboto:wght@300;400&display=swap" rel="stylesheet">
    <style>
        body { background: #121212; color: #fff; font-family: 'Roboto', sans-serif; padding: 20px; text-align: center; }
        h1 { font-family: 'Oswald', sans-serif; color: #ffb400; }
        .container { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin-top: 30px; }
        .card { background: #1e1e1e; border: 1px solid #333; border-radius: 15px; padding: 20px; width: 300px; text-align: left; }
        .card h2 { margin-top: 0; color: #03a9f4; border-bottom: 1px solid #444; padding-bottom: 10px; }
        .stat { font-size: 1.2rem; margin: 15px 0; display: flex; justify-content: space-between; }
        .bar-bg { background: #000; height: 10px; border-radius: 5px; overflow: hidden; margin-bottom: 20px; }
        .bar-fill { height: 100%; background: #03a9f4; width: 0%; transition: width 0.5s; }
        .btn-group { display: flex; gap: 10px; margin-top: 20px; }
        button { flex: 1; padding: 10px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-add { background: #2e7d32; color: white; }
        .btn-reset { background: #c62828; color: white; }
        button:hover { opacity: 0.8; }
        .prediction { font-size: 0.9rem; color: #888; font-style: italic; margin-top: 10px; text-align: center; }
        .back-link { display: block; margin-top: 40px; color: #666; text-decoration: none; }
        .back-link:hover { color: #ffb400; }
    </style>
</head>
<body>
    <h1>🛠 SYSTEM MAINTENANCE</h1>
    <div class="container" id="app">Loading...</div>
    <a href="/" class="back-link">← Back to Dashboard</a>

    <script>
        const CONFIG = {
            'water': { label: 'RO Water Filter', unit: 'Gal', color: '#03a9f4' },
            'propane': { label: 'Propane Tank', unit: 'Lbs', color: '#ffb400' }
        };

        async function load() {
            try {
                const res = await fetch('/api/maintenance');
                const data = await res.json();
                const container = document.getElementById('app');
                container.innerHTML = '';

                Object.keys(data).forEach(key => {
                    const item = data[key];
                    const cfg = CONFIG[key];
                    if (!cfg) return;

                    const pct = Math.max(0, Math.min(100, 100 - ((item.used / item.capacity) * 100)));
                    
                    const div = document.createElement('div');
                    div.className = 'card';
                    div.innerHTML = `
                        <h2>${cfg.label}</h2>
                        <div class="stat"><span>Remaining:</span> <span>${(item.capacity - item.used).toFixed(1)} ${cfg.unit}</span></div>
                        <div class="bar-bg"><div class="bar-fill" style="width: ${pct}%; background: ${cfg.color}"></div></div>
                        <div class="prediction">Est. Depletion: ${item.prediction}</div>
                        <div class="btn-group">
                            <button class="btn-add" onclick="addUsage('${key}')">Add Usage</button>
                            <button class="btn-reset" onclick="reset('${key}')">Reset</button>
                        </div>
                    `;
                    container.appendChild(div);
                });
            } catch (e) { document.getElementById('app').innerText = "Error loading data."; }
        }

        async function addUsage(target) {
            const amt = prompt(`Enter amount used (${CONFIG[target].unit}):`);
            if (amt) {
                await fetch('/api/maintenance', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ action: 'add_usage', target: target, amount: amt, date: new Date().toISOString().split('T')[0] })
                });
                load();
            }
        }

        async function reset(target) {
            if (confirm(`Reset ${CONFIG[target].label} to 100% full?`)) {
                await fetch('/api/maintenance', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ action: 'reset', target: target, date: new Date().toISOString().split('T')[0] })
                });
                load();
            }
        }

        load();
    </script>
</body>
</html>
