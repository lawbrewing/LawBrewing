<body style="background: #121212; color: white; font-family: sans-serif; text-align: center; padding: 50px;">
    <h2>Upload to Library</h2>
    <form method="post" enctype="multipart/form-data" style="display: inline-block; background: #222; padding: 20px; border-radius: 10px;">
        <input type="text" name="beer_id" placeholder="Untappd Beer ID (e.g. 12345)" required><br><br>
        <input type="file" name="file" accept="image/*" required><br><br>
        <input type="submit" value="Upload Label" style="background: gold; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer;">
    </form>
    <br><br>
    <a href="/library" style="color: #888;">Back to Library</a>
</body>
