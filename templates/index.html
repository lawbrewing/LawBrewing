<!DOCTYPE html>
<html>
<head>
    <title>Law Brewing - Live Taps</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { background: #121212; color: white; font-family: 'Segoe UI', sans-serif; text-align: center; margin: 0; }
        header { background: #1a1a1a; padding: 20px; border-bottom: 2px solid gold; }
        
        .container { padding: 20px; max-width: 600px; margin: auto; }
        
        .tap-card { 
            background: #222; 
            margin-bottom: 25px; 
            padding: 15px; 
            border-radius: 15px; 
            border: 1px solid #333;
        }

        .tap-name { font-size: 1.5rem; font-weight: bold; margin-bottom: 10px; color: gold; }

        /* The Keg Bar Container */
        .progress-bg { 
            background: #444; 
            border-radius: 20px; 
            height: 35px; 
            width: 100%; 
            overflow: hidden; 
            position: relative;
        }

        /* The Actual Liquid */
        .progress-fill { 
            background: linear-gradient(90deg, #f39c12, #f1c40f); 
            height: 100%; 
            transition: width 1s ease-in-out; 
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .percent-text { 
            position: absolute; 
            width: 100%; 
            font-weight: bold; 
            color: white; 
            text-shadow: 1px 1px 2px black;
            line-height: 35px;
        }

        nav { margin-top: 30px; }
        nav a { color: gold; text-decoration: none; font-weight: bold; padding: 10px; }
    </style>
</head>
<body>

<header>
    <h1>LAW BREWING</h1>
    <p>Live Kegerator Status</p>
</header>

<div class="container">
    {% for name, data in taps.items() %}
    <div class="tap-card">
        <div class="tap-name">{{ name }}</div>
        
        <div class="progress-bg">
            <div class="percent-text">{{ data.percent }}%</div>
            <div class="progress-fill" style="width: {{ data.percent }}%;"></div>
        </div>
    </div>
    {% endfor %}

    <nav>
        <a href="/library">📖 View Beer Archive</a> | 
        <a href="/upload">➕ Add New Label</a>
    </nav>
</div>

<script>
    // Refresh the page every 30 seconds to update weights automatically
    setTimeout(function(){
       window.location.reload(1);
    }, 30000);
</script>

</body>
</html>
