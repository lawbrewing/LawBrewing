<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cardio & Lower Back</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        
        body { 
            font-family: 'Inter', sans-serif; 
            height: 100dvh; 
            width: 100%;
            overflow: hidden; 
        }
        
        .exercise-item { transition: all 0.3s ease; }
        .active-card { border-left: 4px solid #3b82f6; background-color: #eff6ff; }
        .completed-card { opacity: 0.6; background-color: #f9fafb; }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .active-tab {
            border-bottom: 2px solid #3b82f6;
            color: #3b82f6;
            font-weight: 600;
        }

        /* Modal Transitions */
        .modal-enter { opacity: 0; pointer-events: none; }
        .modal-enter .modal-content { transform: scale(0.95); }
        .modal-active { opacity: 1; pointer-events: auto; }
        .modal-active .modal-content { transform: scale(1); }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 flex flex-col">

    <!-- Header -->
    <header class="bg-white shadow-sm z-50 flex-none relative">
        <div class="max-w-md mx-auto px-4 py-3">
            <div class="flex justify-between items-center mb-3">
                <h1 class="text-xl font-bold text-gray-900 flex items-center gap-2">
                    <i data-lucide="activity" class="text-blue-500"></i> Cardio & Back
                </h1>
                <div class="flex items-center gap-3">
                    <div class="text-xs text-gray-500 font-medium bg-gray-100 px-2 py-1 rounded-full" id="progress-indicator">0%</div>
                    <!-- Trigger Custom Modal -->
                    <button onclick="window.app.showResetModal()" class="text-gray-400 hover:text-red-500 p-1" title="Reset Current Day">
                        <i data-lucide="rotate-ccw" size="20"></i>
                    </button>
                </div>
            </div>
            
            <!-- Level Toggle -->
            <div class="flex items-center justify-between bg-gray-50 p-2 rounded-lg border border-gray-100 mb-2">
                <span class="text-xs font-semibold text-gray-500 uppercase tracking-wide">Difficulty Level</span>
                <div class="flex items-center gap-2">
                    <span class="text-xs text-gray-600" id="lvl-text">Standard</span>
                    <button onclick="window.app.toggleLevel()" class="relative inline-flex h-6 w-11 flex-shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out focus:outline-none bg-gray-200" id="lvl-toggle-bg">
                        <span aria-hidden="true" class="translate-x-0 pointer-events-none inline-block h-5 w-5 transform rounded-full bg-white shadow ring-0 transition duration-200 ease-in-out" id="lvl-toggle-dot"></span>
                    </button>
                </div>
            </div>
        </div>

        <div class="flex overflow-x-auto no-scrollbar border-b border-gray-200 max-w-md mx-auto bg-white">
            <button onclick="window.app.switchTab('day1')" id="tab-day1" class="flex-1 py-3 text-sm text-gray-500 font-medium text-center whitespace-nowrap active-tab">Day 1</button>
            <button onclick="window.app.switchTab('day2')" id="tab-day2" class="flex-1 py-3 text-sm text-gray-500 font-medium text-center whitespace-nowrap">Day 2</button>
            <button onclick="window.app.switchTab('day3')" id="tab-day3" class="flex-1 py-3 text-sm text-gray-500 font-medium text-center whitespace-nowrap">Day 3</button>
            <button onclick="window.app.switchTab('cool')" id="tab-cool" class="flex-1 py-3 text-sm text-gray-500 font-medium text-center whitespace-nowrap">Cool Down</button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto pb-40 scroll-smooth relative" id="content-area">
        <div class="max-w-md mx-auto p-4 space-y-6">
            <div id="intro-card" class="mb-2">
                <h2 class="text-2xl font-bold text-gray-900 mb-1" id="day-title">Loading...</h2>
                <p class="text-gray-600 text-sm" id="day-desc">Initializing workout data...</p>
                <div id="error-msg" class="hidden mt-4 p-4 bg-red-100 text-red-700 rounded text-xs font-mono break-all"></div>
            </div>
            <div id="exercise-list" class="space-y-3"></div>
            <div class="h-24"></div> 
        </div>
    </main>

    <!-- HUD -->
    <div id="active-hud" class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)] z-40 transition-transform duration-300 translate-y-full">
        <div class="max-w-md mx-auto p-4">
            <div class="flex justify-between items-end mb-2">
                <div>
                    <div class="text-xs font-bold text-blue-600 uppercase tracking-wide mb-1">Current Exercise</div>
                    <div class="text-lg font-bold text-gray-900 leading-none truncate w-64" id="hud-title">Plank</div>
                </div>
                <div class="text-3xl font-mono font-bold text-gray-900" id="hud-timer">00:00</div>
            </div>
            <div class="w-full bg-gray-200 h-2 rounded-full overflow-hidden mb-3">
                <div id="hud-progress" class="bg-blue-500 h-full w-0 progress-bar"></div>
            </div>
            <div class="flex gap-3">
                <button onclick="window.app.toggleTimer()" id="hud-action-btn" class="flex-1 bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-700 active:scale-95 transition shadow-sm">Pause</button>
                <button onclick="window.app.skipExercise()" class="px-4 bg-gray-100 text-gray-600 rounded-xl font-medium hover:bg-gray-200 transition">Skip</button>
            </div>
        </div>
    </div>

    <!-- Custom Modal -->
    <div id="custom-modal" class="fixed inset-0 z-[60] flex items-center justify-center bg-black bg-opacity-50 modal-enter transition-opacity duration-200">
        <div class="bg-white rounded-xl shadow-xl p-6 max-w-xs w-full mx-4 modal-content transition-transform duration-200">
            <h3 class="text-lg font-bold text-gray-900 mb-2">Reset Today?</h3>
            <p class="text-sm text-gray-600 mb-6">This will clear your progress for the current day only. This cannot be undone.</p>
            <div class="flex gap-3">
                <button onclick="window.app.hideResetModal()" class="flex-1 px-4 py-2 bg-gray-100 text-gray-700 rounded-lg font-medium hover:bg-gray-200">Cancel</button>
                <button onclick="window.app.confirmReset()" class="flex-1 px-4 py-2 bg-red-600 text-white rounded-lg font-medium hover:bg-red-700">Reset</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed top-20 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-4 py-2 rounded-full shadow-lg text-sm opacity-0 transition-opacity duration-300 pointer-events-none z-[70]">
        Action Completed
    </div>

    <!-- Audio File -->
    <audio id="sound-complete" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <script>
        try {
            // --- DATA ---
            const buildDay3 = (isLevel2) => {
                const warmUp = [
                    { id: 'd3-1', name: "Pigeon / Figure-4 (R)", reps: "60s", type: "timer", duration: 60, note: "Deep hip stretch." },
                    { id: 'd3-2', name: "Pigeon / Figure-4 (L)", reps: "60s", type: "timer", duration: 60, note: "Breathe into tension." },
                    { id: 'd3-3', name: "Hamstring Stretch (R)", reps: "60s", type: "timer", duration: 60, note: "Keep leg straight but soft." },
                    { id: 'd3-4', name: "Hamstring Stretch (L)", reps: "60s", type: "timer", duration: 60, note: "Hinge from hips." },
                    { id: 'd3-5', name: "Child's Pose", reps: "60s", type: "timer", duration: 60, note: "Rest forehead on floor." },
                    { id: 'd3-6', name: "Happy Baby", reps: "60s", type: "timer", duration: 60, note: "Grab feet, knees wide." }
                ];

                const duration = isLevel2 ? 50 : 45; 

                const circuitExercises = [
                    { name: "High Knees", duration: duration, note: "Knees up!" },
                    { name: "Rest", duration: 15, note: "Breathe." },
                    { name: "Butt Kicks", duration: duration, note: "Heels to glutes." },
                    { name: "Rest", duration: 15, note: "Breathe." },
                    { name: "Jumping Jacks", duration: duration, note: "Full extension." },
                    { name: "Rest", duration: 15, note: "Breathe." },
                    { name: "Mountain Climbers", duration: duration, note: "Back flat, knees in." },
                    { name: "Rest", duration: 15, note: "Prepare for next round." }
                ];

                let fullRoutine = [...warmUp];
                
                for(let i=1; i<=4; i++) {
                    circuitExercises.forEach((ex, idx) => {
                        if (i === 4 && ex.name === "Rest") return; 
                        
                        fullRoutine.push({
                            id: `d3-r${i}-${idx}`,
                            name: `${ex.name} (Round ${i})`,
                            reps: `${ex.duration}s`,
                            type: "timer",
                            duration: ex.duration,
                            note: ex.note
                        });
                    });
                }
                return fullRoutine;
            };

            const getWorkoutData = (isLevel2) => ({
                day1: {
                    title: isLevel2 ? "Day 1: Mobility & Cardio (Lvl 2)" : "Day 1: Mobility & Cardio",
                    desc: "Dynamic movement + Zone 4 Cardio Work.",
                    exercises: [
                        { id: 'd1-1', name: "Cat-Cow Stretch", reps: "10 reps", type: "reps", note: "Move slowly segment by segment." },
                        { id: 'd1-2', name: "Bird-Dog (Right)", reps: "10 reps", type: "reps", note: "Extend opposite arm & leg." },
                        { id: 'd1-3', name: "Bird-Dog (Left)", reps: "10 reps", type: "reps", note: "Keep core tight." },
                        { id: 'd1-4', name: "Pelvic Tilts", reps: "15 reps", type: "reps", note: "Flatten back into floor." },
                        { id: 'd1-5', name: "Knee-to-Chest Hold", reps: "30s", type: "timer", duration: 30, note: "Both knees gentle pull." },
                        { id: 'd1-6', name: "Spinal Twist (Right)", reps: "30s", type: "timer", duration: 30, note: "Shoulders flat." },
                        { id: 'd1-7', name: "Spinal Twist (Left)", reps: "30s", type: "timer", duration: 30, note: "Relax into it." },
                        { id: 'd1-8', name: "Cardio: Brisk Walk/Cycle", reps: isLevel2 ? "25 min" : "20 min", type: "timer", duration: isLevel2 ? 1500 : 1200, note: "Start timer ONLY when in Zone 4." } 
                    ]
                },
                day2: {
                    title: isLevel2 ? "Day 2: Strength & Weights (Lvl 2)" : "Day 2: Strength & Cardio",
                    desc: isLevel2 ? "Bodyweight progression + DB Rows." : "Core strength + Zone 4 Cardio Work.",
                    exercises: [
                        // UPDATED: Replaced Weighted Bridges with Single Leg Bridges to avoid PowerBlock issues
                        { 
                            id: 'd2-1', 
                            name: isLevel2 ? "Single-Leg Bridge (R)" : "Bridges", 
                            reps: "12 reps", 
                            type: "reps", 
                            note: isLevel2 ? "Lift left leg, drive through right heel." : "Squeeze glutes at top." 
                        },
                        { id: 'd2-2', name: "Rest / Reset", reps: "30s", type: "timer", duration: 30, note: "Breathe." },
                        { 
                            id: 'd2-3', 
                            name: isLevel2 ? "Single-Leg Bridge (L)" : "Bridges (Set 2)", 
                            reps: "12 reps", 
                            type: "reps", 
                            note: isLevel2 ? "Lift right leg, drive through left heel." : "Focus on form." 
                        },
                        { id: 'd2-4', name: "Plank", reps: "45s", type: "timer", duration: 45, note: "Straight line head to heels." },
                        { id: 'd2-5', name: "Rest", reps: "15s", type: "timer", duration: 15, note: "Drop to knees." },
                        { id: 'd2-6', name: "Plank (Set 2)", reps: "45s", type: "timer", duration: 45, note: "Hold tight." },
                        { id: 'd2-7', name: "Side Plank (Right)", reps: "30s", type: "timer", duration: 30, note: "Lift hips high." },
                        { id: 'd2-8', name: "Side Plank (Left)", reps: "30s", type: "timer", duration: 30, note: "Lift hips high." },
                        { 
                            id: 'd2-9', 
                            name: isLevel2 ? "Supported DB Row" : "Superman", 
                            reps: "10 reps/side", 
                            type: "reps", 
                            note: isLevel2 ? "Hand on bench. Flat back. Row to hip." : "Lift arms and legs gently." 
                        },
                        { id: 'd2-10', name: "Cardio: Jog/Row", reps: isLevel2 ? "25 min" : "20 min", type: "timer", duration: isLevel2 ? 1500 : 1200, note: "Start timer ONLY when in Zone 4." }
                    ]
                },
                day3: {
                    title: isLevel2 ? "Day 3: Deep Flex & Circuit (Lvl 2)" : "Day 3: Deep Flex & Circuit",
                    desc: "Deep stretching followed by 4 rounds of interval cardio.",
                    exercises: buildDay3(isLevel2)
                },
                cool: {
                    title: "Cool Down",
                    desc: "Essential post-workout recovery.",
                    exercises: [
                        { id: 'c-1', name: "Reclined Twist (R)", reps: "45s", type: "timer", duration: 45, note: "Twist gently." },
                        { id: 'c-2', name: "Reclined Twist (L)", reps: "45s", type: "timer", duration: 45, note: "Twist gently." },
                        { id: 'c-3', name: "Figure-Four (R)", reps: "45s", type: "timer", duration: 45, note: "Thread the needle." },
                        { id: 'c-4', name: "Figure-Four (L)", reps: "45s", type: "timer", duration: 45, note: "Relax shoulders." },
                        { id: 'c-5', name: "Knee Hug Rock", reps: "45s", type: "timer", duration: 45, note: "Massage lower back." },
                        { id: 'c-6', name: "Seated Forward Fold", reps: "60s", type: "timer", duration: 60, note: "Reach for toes." }
                    ]
                }
            });

            class App {
                constructor() {
                    this.currentDay = 'day1';
                    this.exercises = [];
                    this.completedIds = new Set();
                    this.customDurations = {}; 
                    this.isLevel2 = false;
                    this.activeIndex = -1; 
                    this.timerInterval = null;
                    this.timeLeft = 0;
                    this.totalTime = 0;
                    this.endTime = 0;
                    this.isPaused = false;
                    
                    this.init();
                }

                init() {
                    this.loadProgress();
                    this.safeCreateIcons();
                    this.updateLevelUI();
                    this.switchTab('day1');
                }

                loadProgress() {
                    try {
                        const saved = localStorage.getItem('workout_completed');
                        if (saved) this.completedIds = new Set(JSON.parse(saved));
                        
                        const savedTimes = localStorage.getItem('workout_durations');
                        if (savedTimes) this.customDurations = JSON.parse(savedTimes);
                        
                        const savedLvl = localStorage.getItem('workout_level');
                        this.isLevel2 = savedLvl === 'true';
                    } catch(e) {
                        console.log("Local storage unavailable", e);
                    }
                }

                saveProgress() {
                    try {
                        localStorage.setItem('workout_completed', JSON.stringify([...this.completedIds]));
                        localStorage.setItem('workout_durations', JSON.stringify(this.customDurations));
                        localStorage.setItem('workout_level', this.isLevel2);
                    } catch (e) {
                        console.log("Local storage write failed", e);
                    }
                }

                // --- NEW UI BASED RESET ---
                showResetModal() {
                    const modal = document.getElementById('custom-modal');
                    modal.classList.remove('pointer-events-none', 'opacity-0');
                    modal.classList.add('modal-active');
                }

                hideResetModal() {
                    const modal = document.getElementById('custom-modal');
                    modal.classList.remove('modal-active');
                    modal.classList.add('pointer-events-none', 'opacity-0');
                }

                confirmReset() {
                    // Iterate through current exercises and remove them from completed set
                    this.exercises.forEach(ex => {
                        this.completedIds.delete(ex.id);
                    });
                    this.saveProgress();
                    
                    // Stop timer if running
                    this.stopTimer();
                    this.activeIndex = -1;
                    this.closeHUD();
                    
                    // UI Cleanup
                    this.hideResetModal();
                    this.renderList();
                    this.updateProgress();
                    this.showToast("Day Reset Successfully");
                }

                showToast(msg) {
                    const toast = document.getElementById('toast');
                    toast.innerText = msg;
                    toast.classList.remove('opacity-0');
                    setTimeout(() => {
                        toast.classList.add('opacity-0');
                    }, 2000);
                }

                toggleLevel() {
                    this.isLevel2 = !this.isLevel2;
                    this.saveProgress();
                    this.updateLevelUI();
                    this.switchTab(this.currentDay); 
                }

                updateLevelUI() {
                    const bg = document.getElementById('lvl-toggle-bg');
                    const dot = document.getElementById('lvl-toggle-dot');
                    const text = document.getElementById('lvl-text');
                    
                    if (this.isLevel2) {
                        bg.classList.remove('bg-gray-200');
                        bg.classList.add('bg-blue-600');
                        dot.classList.remove('translate-x-0');
                        dot.classList.add('translate-x-5');
                        text.innerText = "Progression (Lvl 2)";
                        text.classList.add('text-blue-700', 'font-bold');
                    } else {
                        bg.classList.add('bg-gray-200');
                        bg.classList.remove('bg-blue-600');
                        dot.classList.add('translate-x-0');
                        dot.classList.remove('translate-x-5');
                        text.innerText = "Standard";
                        text.classList.remove('text-blue-700', 'font-bold');
                    }
                }

                safeCreateIcons() {
                    try {
                        if (typeof lucide !== 'undefined' && lucide.createIcons) {
                            lucide.createIcons();
                        }
                    } catch (e) {}
                }

                switchTab(dayId) {
                    try {
                        document.querySelectorAll('header button[id^="tab-"]').forEach(b => {
                            b.classList.remove('active-tab', 'text-blue-500');
                            b.classList.add('text-gray-500');
                        });
                        const btn = document.getElementById(`tab-${dayId}`);
                        if(btn) {
                            btn.classList.add('active-tab');
                            btn.classList.remove('text-gray-500');
                        }

                        this.currentDay = dayId;
                        this.stopTimer();
                        this.closeHUD();
                        this.activeIndex = -1;

                        const contentArea = document.getElementById('content-area');
                        if(contentArea) contentArea.scrollTop = 0;

                        const allData = getWorkoutData(this.isLevel2);
                        const data = allData[dayId];
                        this.exercises = JSON.parse(JSON.stringify(data.exercises));
                        
                        this.exercises.forEach(ex => {
                            if (this.customDurations[ex.id]) {
                                ex.duration = this.customDurations[ex.id];
                                if(ex.duration >= 60) {
                                    ex.reps = `${Math.floor(ex.duration/60)} min`;
                                } else {
                                    ex.reps = `${ex.duration}s`;
                                }
                            }
                        });
                        
                        document.getElementById('day-title').innerText = data.title;
                        document.getElementById('day-desc').innerText = data.desc;

                        this.renderList();
                    } catch(e) {
                        console.error("Tab switch failed:", e);
                    }
                }

                editTime(index) {
                    const ex = this.exercises[index];
                    const currentMins = Math.floor(ex.duration / 60);
                    const input = prompt(`Enter duration in minutes for ${ex.name}:`, currentMins);
                    
                    if (input !== null && !isNaN(input) && input > 0) {
                        const newSeconds = Math.round(parseFloat(input) * 60);
                        ex.duration = newSeconds;
                        this.customDurations[ex.id] = newSeconds;
                        this.saveProgress();
                        if(newSeconds >= 60) {
                            ex.reps = `${Math.floor(newSeconds/60)} min`;
                        } else {
                            ex.reps = `${newSeconds}s`;
                        }
                        this.renderList();
                    }
                }

                renderList() {
                    const container = document.getElementById('exercise-list');
                    if (!container) return;
                    container.innerHTML = '';

                    this.exercises.forEach((ex, index) => {
                        const isCompleted = this.completedIds.has(ex.id);
                        const isActive = (index === this.activeIndex);
                        
                        const div = document.createElement('div');
                        div.id = `card-${index}`;
                        div.className = `exercise-item bg-white rounded-xl p-4 shadow-sm border border-gray-100 relative ${isCompleted ? 'completed-card' : ''} ${isActive ? 'active-card' : ''}`;
                        
                        let btnHTML = '';
                        if (isCompleted) {
                            btnHTML = `<button disabled class="bg-green-100 text-green-700 px-4 py-2 rounded-lg font-medium text-sm flex items-center gap-2 w-full justify-center"><i data-lucide="check" size="16"></i> Done</button>`;
                        } else if (isActive) {
                            btnHTML = `<button onclick="window.app.toggleTimer()" class="bg-blue-600 text-white px-4 py-2 rounded-lg font-bold text-sm shadow-md w-full animate-pulse">
                                ${ex.type === 'timer' ? 'Running...' : 'Finish Set'}
                            </button>`;
                        } else {
                            const label = ex.type === 'timer' ? `Start (${this.formatTime(ex.duration)})` : 'Mark Done';
                            const icon = ex.type === 'timer' ? 'play' : 'check-circle';
                            btnHTML = `<button onclick="window.app.startExercise(${index})" class="bg-white border border-gray-200 text-gray-700 hover:bg-blue-50 hover:border-blue-200 px-4 py-2 rounded-lg font-medium text-sm w-full transition flex items-center justify-center gap-2">
                                <i data-lucide="${icon}" size="16"></i> ${label}
                            </button>`;
                        }

                        const editBtn = ex.type === 'timer' && !isActive && !isCompleted 
                            ? `<button onclick="window.app.editTime(${index})" class="ml-2 text-gray-400 hover:text-blue-600 p-1" title="Edit Duration"><i data-lucide="pencil" size="14"></i></button>` 
                            : '';

                        div.innerHTML = `
                            <div class="flex justify-between items-start mb-3">
                                <div>
                                    <h3 class="font-bold text-gray-800 text-lg">${ex.name}</h3>
                                    <p class="text-gray-500 text-sm">${ex.note}</p>
                                </div>
                                <div class="flex items-center">
                                    <span class="text-xs font-bold bg-gray-100 text-gray-600 px-2 py-1 rounded whitespace-nowrap">${ex.reps}</span>
                                    ${editBtn}
                                </div>
                            </div>
                            <div class="mt-2">
                                ${btnHTML}
                            </div>
                        `;
                        container.appendChild(div);
                    });
                    
                    this.safeCreateIcons();
                    this.updateProgress();
                }

                startExercise(index) {
                    if (this.activeIndex !== -1 && this.activeIndex !== index) {
                        this.stopTimer();
                    }

                    this.activeIndex = index;
                    const ex = this.exercises[index];
                    
                    this.renderList();
                    
                    setTimeout(() => {
                        const container = document.getElementById('content-area');
                        const card = document.getElementById(`card-${index}`);
                        
                        if (container && card) {
                            const cardTop = card.offsetTop;
                            const cardHeight = card.offsetHeight;
                            const containerHeight = container.clientHeight;
                            const targetScroll = cardTop - (containerHeight / 2) + (cardHeight / 2);
                            
                            container.scrollTo({
                                top: targetScroll,
                                behavior: 'smooth'
                            });
                        }
                    }, 100);

                    if (ex.type === 'timer') {
                        this.totalTime = ex.duration;
                        this.timeLeft = ex.duration;
                        this.isPaused = false;
                        this.openHUD(ex);
                        this.startSystemTimer();
                    } else {
                        this.markComplete(index);
                    }
                }

                openHUD(ex) {
                    const hud = document.getElementById('active-hud');
                    document.getElementById('hud-title').innerText = ex.name;
                    document.getElementById('hud-action-btn').innerText = "Pause";
                    hud.classList.remove('translate-y-full');
                    this.updateHUDDisplay();
                }

                closeHUD() {
                    document.getElementById('active-hud').classList.add('translate-y-full');
                }

                startSystemTimer() {
                    clearInterval(this.timerInterval);
                    this.endTime = Date.now() + (this.timeLeft * 1000);
                    
                    this.timerInterval = setInterval(() => {
                        const now = Date.now();
                        const remainingSeconds = Math.ceil((this.endTime - now) / 1000);
                        
                        if(remainingSeconds !== this.timeLeft) {
                            this.timeLeft = remainingSeconds;
                            this.updateHUDDisplay();
                        }

                        if (remainingSeconds <= 0) {
                            this.finishTimer();
                        }
                    }, 200);
                }

                toggleTimer() {
                    if (this.isPaused) {
                        this.isPaused = false;
                        this.startSystemTimer();
                        const btn = document.getElementById('hud-action-btn');
                        btn.innerText = "Pause";
                        btn.className = "flex-1 bg-blue-600 text-white py-3 rounded-xl font-bold transition shadow-sm";
                    } else {
                        this.isPaused = true;
                        clearInterval(this.timerInterval);
                        const btn = document.getElementById('hud-action-btn');
                        btn.innerText = "Resume";
                        btn.className = "flex-1 bg-green-500 text-white py-3 rounded-xl font-bold transition shadow-sm";
                    }
                }

                skipExercise() {
                    this.stopTimer();
                    this.closeHUD();
                    this.activeIndex = -1;
                    this.renderList();
                }

                finishTimer() {
                    this.stopTimer();
                    this.timeLeft = 0;
                    this.updateHUDDisplay();
                    this.playCompleteSound();
                    this.markComplete(this.activeIndex);
                }

                playCompleteSound() {
                    const audio = document.getElementById('sound-complete');
                    if(audio) {
                        audio.currentTime = 0;
                        audio.play().catch(() => this.playSynthBeep());
                    } else {
                        this.playSynthBeep();
                    }
                    if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
                }

                playSynthBeep() {
                    try {
                        const ctx = new (window.AudioContext || window.webkitAudioContext)();
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(880, ctx.currentTime);
                        osc.frequency.exponentialRampToValueAtTime(440, ctx.currentTime + 0.5);
                        gain.gain.setValueAtTime(0.1, ctx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + 0.5);
                        osc.start();
                        osc.stop(ctx.currentTime + 0.5);
                    } catch(e) {}
                }

                stopTimer() {
                    clearInterval(this.timerInterval);
                }

                updateHUDDisplay() {
                    const safeTime = Math.max(0, this.timeLeft);
                    document.getElementById('hud-timer').innerText = this.formatTime(safeTime);
                    const pct = ((this.totalTime - safeTime) / this.totalTime) * 100;
                    document.getElementById('hud-progress').style.width = `${pct}%`;
                }

                markComplete(index) {
                    const ex = this.exercises[index];
                    this.completedIds.add(ex.id);
                    this.saveProgress();
                    this.activeIndex = -1;
                    this.closeHUD();
                    this.renderList();
                    this.showToast("Completed");

                    const nextIndex = index + 1;
                    if (nextIndex < this.exercises.length) {
                        setTimeout(() => {
                            const container = document.getElementById('content-area');
                            const card = document.getElementById(`card-${nextIndex}`);
                            if (container && card) {
                                const cardTop = card.offsetTop;
                                const cardHeight = card.offsetHeight;
                                const containerHeight = container.clientHeight;
                                const targetScroll = cardTop - (containerHeight / 2) + (cardHeight / 2);
                                container.scrollTo({ top: targetScroll, behavior: 'smooth' });
                            }
                        }, 500);
                    } else {
                        setTimeout(() => this.showToast("All Done!"), 300);
                    }
                }

                updateProgress() {
                    const total = this.exercises.length;
                    let done = 0;
                    this.exercises.forEach(ex => {
                        if (this.completedIds.has(ex.id)) done++;
                    });
                    
                    const pct = Math.round((done / total) * 100);
                    document.getElementById('progress-indicator').innerText = `${pct}%`;
                }

                formatTime(s) {
                    const m = Math.floor(s / 60);
                    const sec = s % 60;
                    return `${m}:${sec < 10 ? '0' : ''}${sec}`;
                }
            }

            document.addEventListener('DOMContentLoaded', () => {
                window.app = new App();
            });

        } catch (globalErr) {
            document.getElementById('day-title').innerText = "App Error";
            document.getElementById('day-desc').innerText = "The application failed to initialize.";
            const errDiv = document.getElementById('error-msg');
            errDiv.classList.remove('hidden');
            errDiv.innerText = globalErr.toString();
        }
    </script>
</body>
</html>
