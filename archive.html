<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beer Archive | Law Brewing Co.</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Roboto:wght@300;400&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #ffb400; --bg: #121212; --card: #1e1e1e; --text: #ffffff; }
        body { background: var(--bg); color: var(--text); font-family: 'Roboto', sans-serif; margin: 0; padding-bottom: 50px; text-align: center;}
        .header { padding: 40px 0; background: #000; border-bottom: 2px solid var(--accent); }
        .back-link { color: var(--accent); text-decoration: none; font-family: 'Oswald'; letter-spacing: 1px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; max-width: 1100px; margin: 30px auto; padding: 0 20px; }
        .beer-card { background: var(--card); border-radius: 15px; overflow: hidden; border: 1px solid #333; transition: 0.3s; }
        .beer-card:hover { transform: translateY(-5px); }
        .art { width: 100%; height: 200px; background-size: cover; background-position: center; filter: grayscale(50%); }
        .details { padding: 20px; }
        .beer-name { font-family: 'Oswald'; font-size: 1.5rem; margin: 0; text-transform: uppercase; }
        .rating { color: var(--accent); margin: 10px 0; font-size: 1.2rem; cursor: pointer; }
    </style>
</head>
<body>
    <div class="header">
        <a href="index.html" class="back-link">← BACK TO LIVE TAPS</a>
        <h1 style="font-family: 'Oswald'; letter-spacing: 4px;">THE ARCHIVE</h1>
    </div>

    <div class="grid" id="archive-grid">
        </div>

    <script>
        async function loadArchive() {
            const [libReq, tapReq] = await Promise.all([
                fetch('library.json?t=' + Date.now()),
                fetch('taps.json?t=' + Date.now())
            ]);
            const library = await libReq.json();
            const taps = await tapReq.json();
            
            // Get IDs of beers currently on tap
            const activeBeerIds = Object.values(taps).map(t => t.beer_id);
            const grid = document.getElementById('archive-grid');

            for (const [id, beer] of Object.entries(library)) {
                if (!activeBeerIds.includes(id)) {
                    grid.innerHTML += `
                        <div class="beer-card">
                            <div class="art" style="background-image: url('${beer.art}')"></div>
                            <div class="details">
                                <h2 class="beer-name">${beer.name}</h2>
                                <p style="font-size: 0.8rem; color: #888;">${beer.abv} | ${beer.votes} Votes</p>
                                <div class="rating" onclick="rateBeer('${id}')">
                                    ${'★'.repeat(Math.round(beer.rating))}${'☆'.repeat(5-Math.round(beer.rating))}
                                </div>
                                <p style="font-size: 0.9rem; color: #ccc;">${beer.desc}</p>
                            </div>
                        </div>
                    `;
                }
            }
        }

        async function rateBeer(beerId) {
            const score = prompt("Rate this beer from 1 to 5 stars:");
            if (score >= 1 && score <= 5) {
                const PI_IP = window.location.hostname; // Assumes you are viewing on local network
                await fetch(`http://${PI_IP}:5000/rate_library`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ beer_id: beerId, rating: score })
                });
                location.reload();
            }
        }
        loadArchive();
    </script>
</body>
</html>
